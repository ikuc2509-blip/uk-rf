A("65",`1. Срок или размер наказания лицу, признанному присяжными заседателями виновным в совершении преступления, но заслуживающим снисхождения, не может превышать двух третей максимального срока или размера наиболее строгого вида наказания, предусмотренного за совершенное преступление. Если соответствующей статьей Особенной части настоящего Кодекса предусмотрены смертная казнь или пожизненное лишение свободы, эти виды наказаний не применяются, а наказание назначается в пределах санкции, предусмотренной соответствующей статьей Особенной части настоящего Кодекса.
2. Часть утратила силу.
3. При назначении наказания по совокупности преступлений или по совокупности приговоров вид, срок или размер наказания назначаются по правилам, предусмотренным статьями 69 и 70 настоящего Кодекса.
4. При назначении наказания лицу, признанному вердиктом присяжных заседателей виновным в совершении преступления, но заслуживающим снисхождения, обстоятельства, отягчающие наказание, не учитываются.`,

A("66",`1. При назначении наказания за неоконченное преступление учитываются обстоятельства, в силу которых преступление не было доведено до конца.
2. Срок или размер наказания за приготовление к преступлению не может превышать половины максимального срока или размера наиболее строгого вида наказания, предусмотренного соответствующей статьей Особенной части настоящего Кодекса за оконченное преступление.
3. Срок или размер наказания за покушение на преступление не может превышать трех четвертей максимального срока или размера наиболее строгого вида наказания, предусмотренного соответствующей статьей Особенной части настоящего Кодекса за оконченное преступление.
4. Смертная казнь и пожизненное лишение свободы за приготовление к преступлению и покушение на преступление не назначаются.`,
[["Шпаргалка","Приготовление — не более 1/2 максимума. Покушение — не более 3/4. Пожизненное и смертная казнь — никогда."],
 ["Пример","Покушение на кражу по ч. 2 ст. 158 (максимум 5 лет): не более 3 лет 9 месяцев. Если есть ещё п. «и» ст. 61 без отягчающих, то 2/3 считают уже от 3 лет 9 месяцев: не более 2 лет 6 месяцев."]]);
A("67",`1. При назначении наказания за преступление, совершенное в соучастии, учитываются характер и степень фактического участия лица в его совершении, значение этого участия для достижения цели преступления, его влияние на характер и размер причиненного или возможного вреда.
2. Смягчающие или отягчающие обстоятельства, относящиеся к личности одного из соучастников, учитываются при назначении наказания только этому соучастнику.`,

A("68",`1. При назначении наказания при рецидиве, опасном рецидиве или особо опасном рецидиве преступлений учитываются характер и степень общественной опасности ранее совершенных преступлений, обстоятельства, в силу которых исправительное воздействие предыдущего наказания оказалось недостаточным, а также характер и степень общественной опасности вновь совершенных преступлений.
2. Срок наказания при любом виде рецидива преступлений не может быть менее одной третьей части максимального срока наиболее строгого вида наказания, предусмотренного за совершенное преступление, но в пределах санкции соответствующей статьи Особенной части настоящего Кодекса.
3. При любом виде рецидива преступлений, если судом установлены смягчающие обстоятельства, предусмотренные статьей 61 настоящего Кодекса, срок наказания может быть назначен менее одной третьей части максимального срока наиболее строгого вида наказания, предусмотренного за совершенное преступление, но в пределах санкции соответствующей статьи Особенной части настоящего Кодекса, а при наличии исключительных обстоятельств, предусмотренных статьей 64 настоящего Кодекса, может быть назначено более мягкое наказание, чем предусмотрено за данное преступление.`,
[["Кратко","При рецидиве наказание не меньше 1/3 максимума самого строгого вида наказания в санкции."],
 ["Ч. 3","При смягчающих обстоятельствах можно меньше 1/3 (но в пределах санкции), при исключительных — ниже санкции по ст. 64."],
 ["Важно","При рецидиве назначается самый строгий вид наказания из санкции, а не альтернативный мягкий."]]);
A("69",`1. При совокупности преступлений наказание назначается отдельно за каждое совершенное преступление.
2. Если все преступления, совершенные по совокупности, являются преступлениями небольшой или средней тяжести, либо приготовлением к тяжкому или особо тяжкому преступлению, либо покушением на тяжкое или особо тяжкое преступление, окончательное наказание назначается путем поглощения менее строгого наказания более строгим либо путем частичного или полного сложения назначенных наказаний. При этом окончательное наказание не может превышать более чем наполовину максимальный срок или размер наказания, предусмотренного за наиболее тяжкое из совершенных преступлений.
3. Если хотя бы одно из преступлений, совершенных по совокупности, является тяжким или особо тяжким преступлением, то окончательное наказание назначается путем частичного или полного сложения наказаний. При этом окончательное наказание в виде лишения свободы не может превышать более чем наполовину максимальный срок наказания в виде лишения свободы, предусмотренный за наиболее тяжкое из совершенных преступлений.
4. При совокупности преступлений к основным видам наказаний могут быть присоединены дополнительные виды наказаний. Окончательное дополнительное наказание при частичном или полном сложении наказаний не может превышать максимального срока или размера, предусмотренного для данного вида наказания Общей частью настоящего Кодекса.
5. По тем же правилам назначается наказание, если после вынесения судом приговора по делу будет установлено, что осужденный виновен еще и в другом преступлении, совершенном им до вынесения приговора суда по первому делу. В этом случае в окончательное наказание засчитывается наказание, отбытое по первому приговору суда.`,
[["Алгоритм","Сначала наказание назначается за каждое преступление отдельно, затем определяется окончательное."],
 ["Способы","Все небольшой и средней тяжести (или неоконченные тяжкие): поглощение, частичное или полное сложение. Хотя бы одно тяжкое или особо тяжкое оконченное: только сложение."],
 ["Предел","Не более чем в полтора раза выше максимума за самое тяжкое из преступлений, и не более 25 лет лишения свободы (ч. 4 ст. 56)."],
 ["Ч. 5","Преступление выявлено после приговора, но совершено до него: применяются правила ч. 2–3 ст. 69, а не ст. 70."]]);
A("70",`1. При назначении наказания по совокупности приговоров к наказанию, назначенному по последнему приговору суда, частично или полностью присоединяется неотбытая часть наказания по предыдущему приговору суда.
2. Окончательное наказание по совокупности приговоров в случае, если оно менее строгое, чем лишение свободы, не может превышать максимального срока или размера, предусмотренного для данного вида наказания Общей частью настоящего Кодекса.
3. Окончательное наказание по совокупности приговоров в виде лишения свободы не может превышать тридцати лет, за исключением случаев, предусмотренных частью пятой статьи 56 настоящего Кодекса.
4. Окончательное наказание по совокупности приговоров должно быть больше как наказания, назначенного за вновь совершенное преступление, так и неотбытой части наказания по предыдущему приговору суда.
5. Присоединение дополнительных видов наказаний при назначении наказания по совокупности приговоров производится по правилам, предусмотренным частью четвертой статьи 69 настоящего Кодекса.`,
[["Когда","Новое преступление совершено после вынесения приговора, но до полного отбытия наказания по нему."],
 ["Способ","Только присоединение (частичное или полное) неотбытой части. Поглощение невозможно: итог должен быть больше и нового наказания, и неотбытого остатка."],
 ["Отличие от ст. 69","Ст. 69 — все преступления до первого приговора. Ст. 70 — новое преступление после приговора."]]);
A("71",`1. При частичном или полном сложении наказаний по совокупности преступлений и совокупности приговоров одному дню лишения свободы соответствуют:
а) один день принудительных работ, ареста или содержания в дисциплинарной воинской части;
б) два дня ограничения свободы;
в) три дня исправительных работ или ограничения по военной службе;
г) восемь часов обязательных работ.
2. Штраф либо лишение права занимать определенные должности или заниматься определенной деятельностью, лишение специального, воинского или почетного звания, классного чина и государственных наград при сложении их с ограничением свободы, арестом, содержанием в дисциплинарной воинской части, лишением свободы исполняются самостоятельно.`,
[["Таблица пересчёта","1 день лишения свободы = 1 день принудительных работ, ареста, дисбата = 2 дня ограничения свободы = 3 дня исправительных работ = 8 часов обязательных работ."],
 ["Ч. 2","Штраф и лишение права не пересчитываются в дни и при сложении исполняются самостоятельно."]]);
A("72",`1. Сроки лишения права занимать определенные должности или заниматься определенной деятельностью, исправительных работ, ограничения по военной службе, ограничения свободы, принудительных работ, ареста, содержания в дисциплинарной воинской части, лишения свободы исчисляются в месяцах и годах, а обязательных работ - в часах.
2. При замене наказания или сложении наказаний, предусмотренных частью первой настоящей статьи, а также при зачете наказания сроки наказаний могут исчисляться в днях. При этом с учетом положения части первой статьи 71 настоящего Кодекса двести сорок часов обязательных работ соответствуют одному месяцу лишения свободы или принудительных работ, двум месяцам ограничения свободы, трем месяцам исправительных работ или ограничения по военной службе.
3. Время содержания лица под стражей до вступления приговора суда в законную силу засчитывается в сроки содержания в дисциплинарной воинской части из расчета один день за полтора дня, ограничения свободы, принудительных работ и ареста - один день за два дня, исправительных работ и ограничения по военной службе - один день за три дня, а в срок обязательных работ - из расчета один день содержания под стражей за восемь часов обязательных работ.
3.1. Время содержания лица под стражей засчитывается в срок лишения свободы, за исключением случаев, предусмотренных частями третьей.2 и третьей.3 настоящей статьи, из расчета один день за:
а) один день отбывания наказания в тюрьме либо исправительной колонии строгого или особого режима;
б) полтора дня отбывания наказания в воспитательной колонии либо исправительной колонии общего режима;
в) два дня отбывания наказания в колонии-поселении.
3.2. Время содержания лица под стражей засчитывается в срок лишения свободы из расчета один день за один день в отношении осужденных при особо опасном рецидиве преступлений; осужденных, которым смертная казнь в порядке помилования заменена пожизненным лишением свободы или лишением свободы на срок двадцать пять лет; осужденных за преступления, предусмотренные статьями 205 - 205.5, частями третьей и четвертой статьи 206, статьями 208, 209, частью четвертой статьи 211, частями второй и третьей статьи 228, статьями 228.1, 229, 275, 276, 361 настоящего Кодекса, и сопряженные с осуществлением террористической деятельности преступления, предусмотренные статьями 277 - 279 и 360 настоящего Кодекса.
3.3. Время содержания лица под стражей засчитывается в срок лишения свободы из расчета один день за один день в отношении срока нахождения осужденного, отбывающего наказание в строгих условиях в воспитательной колонии или исправительной колонии общего режима, в штрафном или дисциплинарном изоляторе, помещении камерного типа либо едином помещении камерного типа, в случае применения мер взыскания к осужденному в соответствии с уголовно-исполнительным законодательством Российской Федерации.
3.4. Время нахождения лица под домашним арестом засчитывается в срок содержания лица под стражей до судебного разбирательства и в срок лишения свободы из расчета два дня нахождения под домашним арестом за один день содержания под стражей или лишения свободы.
3.5. Если вид исправительного учреждения, назначенный по приговору суда, изменен в порядке, предусмотренном главой 47.1 или 48.1 Уголовно-процессуального кодекса Российской Федерации, на более мягкий, зачет времени отбывания лишения свободы в исправительном учреждении более строгого вида в срок лишения свободы, подлежащий отбытию, осуществляется из расчета:
а) один день отбывания наказания в тюрьме либо исправительной колонии особого или строгого режима за полтора дня отбывания наказания в исправительной колонии общего режима либо два дня отбывания наказания в колонии-поселении;
б) один день отбывания наказания в исправительной колонии общего режима за полтора дня отбывания наказания в колонии-поселении.
4. Время содержания лица под стражей до вступления приговора суда в законную силу и время отбытия лишения свободы, назначенного приговором суда за преступление, совершенное вне пределов Российской Федерации, в случае выдачи лица на основании статьи 13 настоящего Кодекса засчитываются по правилам, установленным частями третьей и третьей.1 настоящей статьи.
5. При назначении осужденному, содержавшемуся под стражей до судебного разбирательства, в качестве основного вида наказания штрафа, лишения права занимать определенные должности или заниматься определенной деятельностью суд, учитывая срок содержания под стражей, смягчает назначенное наказание или полностью освобождает его от отбывания этого наказания.`,
[["Зачёт СИЗО в лишение свободы (ч. 3.1)","1 день под стражей = 1 день в тюрьме, строгом и особом режиме; = 1,5 дня в общем режиме и воспитательной колонии; = 2 дня в колонии-поселении."],
 ["Исключения (ч. 3.2)","Только день за день: особо опасный рецидив, терроризм, ч. 2 и 3 ст. 228, ст. 228.1 и другие перечисленные статьи."],
 ["Домашний арест (ч. 3.4)","2 дня домашнего ареста = 1 день под стражей или лишения свободы."],
 ["Ч. 5","Если человек сидел в СИЗО, а наказан штрафом, суд смягчает штраф или полностью освобождает от него."]]);
A("72.1",`1. При назначении лицу, признанному больным наркоманией, основного наказания в виде штрафа, лишения права занимать определенные должности или заниматься определенной деятельностью, обязательных работ, исправительных работ или ограничения свободы суд может возложить на осужденного обязанность пройти лечение от наркомании и медицинскую и (или) социальную реабилитацию.
2. Контроль за исполнением осужденным обязанности пройти лечение от наркомании и медицинскую и (или) социальную реабилитацию осуществляется уголовно-исполнительной инспекцией в порядке, определяемом федеральным органом исполнительной власти, осуществляющим функции по выработке и реализации государственной политики и нормативно-правовому регулированию в сфере исполнения уголовных наказаний, совместно с федеральным органом исполнительной власти, осуществляющим функции по выработке и реализации государственной политики и нормативно-правовому регулированию в сфере здравоохранения.`,
[["Кратко","К наказаниям, не связанным с изоляцией, суд может добавить обязанность лечиться от наркомании и пройти реабилитацию. Контролирует уголовно-исполнительная инспекция."],
 ["Связь","Отсрочка отбывания наказания больным наркоманией — отдельный институт (ст. 82.1)."]]);
A("73",`1. Если, назначив исправительные работы, ограничение по военной службе, содержание в дисциплинарной воинской части или лишение свободы на срок до восьми лет, суд придет к выводу о возможности исправления осужденного без реального отбывания наказания, он постановляет считать назначенное наказание условным. Условное осуждение не назначается:
а) осужденным за преступления против половой неприкосновенности несовершеннолетних, не достигших четырнадцатилетнего возраста;
а.1) осужденным за преступления, предусмотренные, частями первой и второй статьи 205.1, статьей 205.2, частью второй статьи 205.4, частями первой - третьей статьи 206, частью четвертой статьи 210, статьей 210.1, частью второй статьи 281.3 и статьей 360 настоящего Кодекса;
б) при совершении тяжкого или особо тяжкого преступления в течение испытательного срока при условном осуждении, назначенном за совершение умышленного преступления, либо в течение неотбытой части наказания, назначенного за совершение умышленного преступления, при условно-досрочном освобождении;
в) при опасном или особо опасном рецидиве.
2. При назначении условного осуждения суд учитывает характер и степень общественной опасности совершенного преступления, личность виновного, в том числе смягчающие и отягчающие обстоятельства.
3. При назначении условного осуждения суд устанавливает испытательный срок, в течение которого условно осужденный должен своим поведением доказать свое исправление. В случае назначения лишения свободы на срок до одного года или более мягкого вида наказания испытательный срок должен быть не менее шести месяцев и не более трех лет, а в случае назначения лишения свободы на срок свыше одного года - не менее шести месяцев и не более пяти лет. Испытательный срок исчисляется с момента вступления приговора в законную силу. В испытательный срок засчитывается время, прошедшее со дня провозглашения приговора.
3.1. В случае назначения наказания в виде содержания в дисциплинарной воинской части условно испытательный срок устанавливается в пределах оставшегося срока военной службы на день провозглашения приговора.
4. При условном осуждении также могут быть назначены дополнительные виды наказаний.
5. Суд, назначая условное осуждение, возлагает на условно осужденного с учетом его возраста, трудоспособности и состояния здоровья исполнение определенных обязанностей: не менять постоянного места жительства, работы, учебы без уведомления специализированного государственного органа, осуществляющего контроль за поведением условно осужденного, не посещать определенные места, пройти курс лечения от алкоголизма, наркомании, токсикомании или венерического заболевания, трудиться (трудоустроиться) либо продолжить обучение в общеобразовательной организации. Суд может возложить на условно осужденного исполнение и других обязанностей, способствующих его исправлению.
6. Контроль за поведением условно осужденного осуществляется уполномоченным на то специализированным государственным органом, а в отношении военнослужащих - командованием воинских частей и учреждений.
7. В течение испытательного срока суд по представлению органа, осуществляющего контроль за поведением условно осужденного, может отменить полностью или частично либо дополнить ранее установленные для условно осужденного обязанности.
Примечание. Для целей настоящей статьи, а также статей 79, 80, 82 и 97 настоящего Кодекса к преступлениям против половой неприкосновенности несовершеннолетних, не достигших четырнадцатилетнего возраста, относятся преступления, предусмотренные статьями 131 - 135, 240, 241, 242, 242.1 и 242.2 настоящего Кодекса, совершенные в отношении несовершеннолетних, не достигших четырнадцатилетнего возраста.`,
[["Кратко","Условным может быть только назначенное: исправительные работы, ограничение по военной службе, дисбат или лишение свободы до 8 лет. Условное осуждение — не вид наказания, а особый порядок его исполнения."],
 ["Испытательный срок","При лишении свободы до 1 года или более мягком наказании — от 6 месяцев до 3 лет; при лишении свободы свыше 1 года — от 6 месяцев до 5 лет."],
 ["Когда нельзя","Преступления против половой неприкосновенности детей до 14 лет; терроризм и ряд других составов (п. «а.1»); тяжкое или особо тяжкое преступление в испытательный срок или в период УДО; опасный и особо опасный рецидив."]]);
A("74",`1. Если до истечения испытательного срока условно осужденный своим поведением доказал свое исправление, возместил вред (полностью или частично), причиненный преступлением, в размере, определенном решением суда, суд по представлению органа, осуществляющего контроль за поведением условно осужденного, может постановить об отмене условного осуждения и о снятии с осужденного судимости. При этом условное осуждение может быть отменено по истечении не менее половины установленного испытательного срока.
2. Если условно осужденный уклонился от исполнения возложенных на него судом обязанностей, уклонился от возмещения вреда (полностью или частично), причиненного преступлением, в размере, определенном решением суда, или совершил нарушение общественного порядка, за которое он был привлечен к административной ответственности, суд по представлению органа, указанного в части первой настоящей статьи, может продлить испытательный срок, но не более чем на один год.
2.1. Если условно осужденный в течение продленного испытательного срока в связи с его уклонением от возмещения вреда, причиненного преступлением, в размере, определенном решением суда, систематически уклоняется от возмещения указанного вреда, суд по представлению органа, указанного в части первой настоящей статьи, также может вынести решение об отмене условного осуждения и исполнении наказания, назначенного приговором суда.
3. Если условно осужденный в течение испытательного срока систематически нарушал общественный порядок, за что привлекался к административной ответственности, систематически не исполнял возложенные на него судом обязанности либо скрылся от контроля, суд по представлению органа, указанного в части первой настоящей статьи, может вынести решение об отмене условного осуждения и исполнении наказания, назначенного приговором суда.
4. В случае совершения условно осужденным в течение испытательного срока преступления по неосторожности либо умышленного преступления небольшой или средней тяжести вопрос об отмене или о сохранении условного осуждения решается судом.
5. В случае совершения условно осужденным в течение испытательного срока умышленного тяжкого или особо тяжкого преступления суд отменяет условное осуждение и назначает ему наказание по правилам, предусмотренным статьей 70 настоящего Кодекса. По этим же правилам назначается наказание в случаях, предусмотренных частью четвертой настоящей статьи.
6. Правила, установленные частями четвертой и пятой настоящей статьи, применяются также, если преступления, указанные в этих частях, совершены до вступления приговора, предусматривающего условное осуждение, в законную силу. В этом случае судебное разбирательство в отношении нового преступления может состояться только после вступления приговора, предусматривающего условное осуждение, в законную силу.`,
[["Хороший исход (ч. 1)","После половины испытательного срока суд может досрочно отменить условное осуждение и снять судимость."],
 ["Плохой исход","Уклонение или административное правонарушение — продление срока до 1 года. Систематические нарушения или побег от контроля — отмена и реальное наказание."],
 ["Новое преступление","Неосторожное или умышленное небольшой и средней тяжести — суд решает сам. Умышленное тяжкое или особо тяжкое — отмена обязательна, наказание по ст. 70."]]);
A("75",`1. Лицо, впервые совершившее преступление небольшой или средней тяжести, может быть освобождено от уголовной ответственности, если после совершения преступления добровольно явилось с повинной, способствовало раскрытию и расследованию этого преступления, возместило ущерб или иным образом загладило вред, причиненный этим преступлением, и вследствие деятельного раскаяния перестало быть общественно опасным.
2. Лицо, совершившее преступление иной категории, освобождается от уголовной ответственности только в случаях, специально предусмотренных соответствующими статьями Особенной части настоящего Кодекса.`,
[["Условия (ч. 1)","Впервые; небольшой или средней тяжести; явка с повинной, способствование раскрытию, возмещение ущерба или заглаживание вреда; вследствие этого лицо перестало быть общественно опасным. Это право суда, а не обязанность."],
 ["Ч. 2","Для тяжких и особо тяжких преступлений — только по специальным примечаниям в Особенной части (например, к ст. 205, 206, 222, 228, 291). Там освобождение обязательное."],
 ["Отличие от добровольного отказа","Добровольный отказ (ст. 31) — до окончания преступления, деятельное раскаяние — после."]]);
A("76",`Лицо, впервые совершившее преступление небольшой или средней тяжести, может быть освобождено от уголовной ответственности, если оно примирилось с потерпевшим и загладило причиненный потерпевшему вред.`,
[["Условия","Впервые; небольшой или средней тяжести; примирение с потерпевшим; вред заглажен. Решает суд, это его право."],
 ["Важно","Нужна позиция именно потерпевшего. Если потерпевшего нет (например, преступления против государства), ст. 76 не применяется, но может подойти ст. 76.2."]]);
A("76.1",`1. Лицо, впервые совершившее преступление, предусмотренное статьями 198 - 199.1, 199.3, 199.4 настоящего Кодекса, освобождается от уголовной ответственности, если ущерб, причиненный бюджетной системе Российской Федерации в результате преступления, возмещен в полном объеме.
2. Лицо, впервые совершившее преступление, предусмотренное частями первой и второй, пунктом "в" части третьей статьи 146, частью первой статьи 147, частями пятой - седьмой статьи 159, частью первой статьи 159.1, частью первой статьи 159.2, частью первой статьи 159.3, частью первой статьи 159.5, частью первой статьи 159.6, частью первой статьи 160, частью первой и пунктом "б" части второй статьи 165, статьей 170.2, частью первой статьи 171, частями первой и первой.1 статьи 171.1, статьей 171.5, частью первой и пунктом "б" части второй статьи 172, частью первой статьи 173.3, статьями 176, 177, частями первой и второй, пунктами "в" и "г" части третьей статьи 178, частями первой и второй статьи 180, частями первой и второй статьи 185, статьей 185.1, частью первой статьи 185.2, частью первой статьи 185.3, частью первой статьи 185.4, статьей 185.6, частями второй и четвертой статьи 191, статьей 192, частью первой и пунктом "а" части второй статьи 193, частями первой и второй статьи 194, статьями 195 - 197 и 199.2 настоящего Кодекса, освобождается от уголовной ответственности, если возместило ущерб, причиненный гражданину, организации или государству в результате совершения преступления, и перечислило в федеральный бюджет денежное возмещение в размере двукратной суммы причиненного ущерба, либо перечислило в федеральный бюджет доход, полученный в результате совершения преступления, и денежное возмещение в размере двукратной суммы дохода, полученного в результате совершения преступления, либо перечислило в федеральный бюджет денежную сумму, эквивалентную размеру убытков, которых удалось избежать в результате совершения преступления, и денежное возмещение в размере двукратной суммы убытков, которых удалось избежать в результате совершения преступления, либо перечислило в федеральный бюджет денежную сумму, эквивалентную размеру совершенного деяния, предусмотренного соответствующей статьей Особенной части настоящего Кодекса, и денежное возмещение в двукратном размере этой суммы.
3. Лицо освобождается от уголовной ответственности при выявлении факта совершения им до 1 января 2015 года либо до 1 января 2022 года деяний, содержащих признаки составов преступлений, предусмотренных статьей 193, частями первой и второй статьи 194, статьями 198, 199, 199.1, 199.2 настоящего Кодекса, при условии, если это лицо является декларантом или лицом, информация о котором содержится в соответствующей специальной декларации, поданной в соответствии с Федеральным законом "О добровольном декларировании физическими лицами активов и счетов (вкладов) в банках и о внесении изменений в отдельные законодательные акты Российской Федерации", и если такие деяния связаны с приобретением (формированием источников приобретения), использованием либо распоряжением имуществом и (или) контролируемыми иностранными компаниями, информация о которых содержится в соответствующей специальной декларации, и (или) с открытием и (или) зачислением денежных средств на счета (вклады), информация о которых содержится в соответствующей специальной декларации. В этом случае не применяются положения частей первой и второй настоящей статьи в части возмещения ущерба, перечисления в федеральный бюджет денежного возмещения и полученного дохода.`,
[["Кратко","Специальное освобождение для экономических и налоговых преступлений. Здесь закон говорит «освобождается», то есть при соблюдении условий освобождение обязательно."],
 ["Ч. 1 (налоги)","Достаточно впервые совершить преступление по ст. 198–199.1, 199.3, 199.4 и полностью возместить ущерб бюджету."],
 ["Ч. 2 (иные экономические)","Возместить ущерб и дополнительно перечислить в бюджет двукратную сумму ущерба, дохода или избежанных убытков."]]);
A("76.2",`Лицо, впервые совершившее преступление небольшой или средней тяжести, может быть освобождено судом от уголовной ответственности с назначением судебного штрафа в случае, если оно возместило ущерб или иным образом загладило причиненный преступлением вред.`,
[["Условия","Впервые; небольшой или средней тяжести; ущерб возмещён или вред заглажен. Согласие потерпевшего не требуется."],
 ["Судебный штраф — не наказание","Это иная мера уголовно-правового характера (ст. 104.4), судимости не влечёт. При неуплате суд отменяет решение, и лицо привлекают к ответственности на общих основаниях."],
 ["Отличие от ст. 76","При ст. 76 нужно примирение с потерпевшим, при ст. 76.2 — нет, но назначается штраф."]]);
A("78",`1. Лицо освобождается от уголовной ответственности, если со дня совершения преступления истекли следующие сроки:
а) два года после совершения преступления небольшой тяжести;
б) шесть лет после совершения преступления средней тяжести;
в) десять лет после совершения тяжкого преступления;
г) пятнадцать лет после совершения особо тяжкого преступления.
2. Сроки давности исчисляются со дня совершения преступления и до момента вступления приговора суда в законную силу. В случае совершения лицом нового преступления сроки давности по каждому преступлению исчисляются самостоятельно.
3. Течение сроков давности приостанавливается, если лицо, совершившее преступление, уклоняется от следствия или суда либо от уплаты судебного штрафа, назначенного в соответствии со статьей 76.2 настоящего Кодекса. В этом случае течение сроков давности возобновляется с момента задержания указанного лица или явки его с повинной.
4. Вопрос о применении сроков давности к лицу, совершившему преступление, наказуемое смертной казнью или пожизненным лишением свободы, решается судом. Если суд не сочтет возможным освободить указанное лицо от уголовной ответственности в связи с истечением сроков давности, то смертная казнь и пожизненное лишение свободы не применяются.
5. К лицам, совершившим преступления, предусмотренные статьями 205, 205.1, 205.3, 205.4, 205.5, частями третьей и четвертой статьи 206, частью четвертой статьи 211, статьями 281 - 281.3, 353, 356, 357, 358, 361 настоящего Кодекса, а равно совершившим сопряженные с осуществлением террористической деятельности преступления, предусмотренные статьями 277, 278, 279 и 360 настоящего Кодекса, сроки давности не применяются.`,
[["Шпаргалка","2 года — небольшой тяжести, 6 лет — средней, 10 лет — тяжкие, 15 лет — особо тяжкие."],
 ["Как считать","Со дня совершения преступления до вступления приговора в законную силу. Новое преступление не прерывает давность по старому: каждый срок течёт самостоятельно. Уклонение от следствия или суда приостанавливает срок."],
 ["Важно","Освобождение по давности не реабилитирует. Если лицо возражает против прекращения дела, дело рассматривается по существу (ч. 2 ст. 27 УПК). Для терроризма, диверсии и преступлений против мира срока давности нет (ч. 5)."]]);
A("78.1",`1. Лицо, совершившее преступление, за исключением преступления против половой неприкосновенности несовершеннолетних, предусмотренного пунктом "а" части третьей, пунктом "б" части четвертой, частью пятой статьи 131, пунктом "а" части третьей, пунктом "б" части четвертой, частью пятой статьи 132, частями третьей - шестой статьи 134 или частями третьей - пятой статьи 135 настоящего Кодекса, либо хотя бы одного из преступлений, предусмотренных статьями 189, 205 - 205.5, 206, 208, частями первой и третьей статьи 209, частями первой, первой.1, третьей и четвертой статьи 210, статьями 210.1, 211, частью третьей статьи 220, частями второй и третьей статьи 221, частями первой.1, второй и третьей статьи 226.1, пунктом "а" части четвертой статьи 229.1, статьями 274.1, 275, 275.1, 276 - 280.2, 280.4, 281 - 281.3, 282.1 - 282.3, 283 - 283.2, 355, 359 - 361 настоящего Кодекса, призванное на военную службу в период мобилизации или в военное время в Вооруженные Силы Российской Федерации либо заключившее в период мобилизации, в период военного положения или в военное время контракт о прохождении военной службы в Вооруженных Силах Российской Федерации, а равно лицо, совершившее преступление в период прохождения военной службы в Вооруженных Силах Российской Федерации в период мобилизации, в период военного положения или в военное время, в отношении которых производство по уголовному делу приостановлено по ходатайству командования воинской части (учреждения) в случаях, предусмотренных Уголовно-процессуальным кодексом Российской Федерации, освобождается от уголовной ответственности:
а) со дня награждения государственной наградой, полученной в период прохождения военной службы;
б) со дня увольнения с военной службы по основанию, предусмотренному подпунктом "а", "в" или "о" пункта 1 статьи 51 Федерального закона от 28 марта 1998 года N 53-ФЗ "О воинской обязанности и военной службе".
2. Контроль за поведением лиц, указанных в части первой настоящей статьи, осуществляется командованием воинской части (учреждения).`,
[["Кратко","Лицо, которое призвано на военную службу в период мобилизации или военное время либо заключило контракт в эти периоды, освобождается от уголовной ответственности с момента награждения государственной наградой или увольнения по возрасту, здоровью либо в связи с окончанием мобилизации или военного положения (подп. «а», «в», «о» п. 1 ст. 51 Закона о воинской обязанности)."],
 ["Механизм","Сначала дело приостанавливается по ходатайству командования, затем при наступлении одного из оснований лицо освобождается."],
 ["Исключения","Не применяется к тяжким половым преступлениям против несовершеннолетних, терроризму, измене, шпионажу, диверсии и другим преступлениям из перечня ч. 1. Статья неоднократно менялась, последний раз законом от 04.08.2026 № 300-ФЗ."]]);
A("79",`1. Лицо, отбывающее содержание в дисциплинарной воинской части, принудительные работы или лишение свободы, подлежит условно-досрочному освобождению, если судом будет признано, что для своего исправления оно не нуждается в полном отбывании назначенного судом наказания, а также возместило вред (полностью или частично), причиненный преступлением, в размере, определенном решением суда. При этом лицо может быть полностью или частично освобождено от отбывания дополнительного вида наказания.
2. Применяя условно-досрочное освобождение, суд может возложить на осужденного обязанности, предусмотренные частью пятой статьи 73 настоящего Кодекса, которые должны им исполняться в течение оставшейся не отбытой части наказания.
3. Условно-досрочное освобождение может быть применено только после фактического отбытия осужденным:
а) не менее одной трети срока наказания, назначенного за преступление небольшой или средней тяжести;
б) не менее половины срока наказания, назначенного за тяжкое преступление;
в) не менее двух третей срока наказания, назначенного за особо тяжкое преступление, а также двух третей срока наказания, назначенного лицу, ранее условно-досрочно освобождавшемуся, если условно-досрочное освобождение было отменено по основаниям, предусмотренным частью седьмой настоящей статьи;
г) не менее трех четвертей срока наказания, назначенного за преступления против половой неприкосновенности несовершеннолетних, а равно за тяжкие и особо тяжкие преступления, связанные с незаконным оборотом наркотических средств, психотропных веществ и их прекурсоров, а также за преступления, предусмотренные статьями 205, 205.1, 205.2, 205.3, 205.4, 205.5, 210, 281 - 281.3 и 361 настоящего Кодекса;
д) не менее четырех пятых срока наказания, назначенного за преступления против половой неприкосновенности несовершеннолетних, не достигших четырнадцатилетнего возраста.
3.1. Условно-досрочное освобождение может быть применено только после фактического отбытия осужденными беременной женщиной или женщиной, имеющей ребенка в возрасте до четырех лет, находящегося в доме ребенка исправительного учреждения, не менее одной четверти срока наказания, назначенного за преступление небольшой тяжести.
3.2. Осужденному, неотбытая часть наказания которому была заменена более мягким видом наказания, срок наказания, после фактического отбытия которого может быть применено условно-досрочное освобождение, исчисляется с момента начала срока отбывания наказания, назначенного по приговору суда.
4. Фактически отбытый осужденным срок лишения свободы не может быть менее шести месяцев.
4.1. При рассмотрении ходатайства осужденного об условно-досрочном освобождении от отбывания наказания суд учитывает поведение осужденного, его отношение к учебе и труду в течение всего периода отбывания наказания, в том числе имеющиеся поощрения и взыскания, отношение осужденного к совершенному деянию и то, что осужденный частично или полностью возместил причиненный ущерб или иным образом загладил вред, причиненный в результате преступления, а также заключение администрации исправительного учреждения о целесообразности его условно-досрочного освобождения. В отношении осужденного, страдающего расстройством сексуального предпочтения (педофилией), не исключающим вменяемости, и совершившего в возрасте старше восемнадцати лет преступление против половой неприкосновенности несовершеннолетнего, не достигшего четырнадцатилетнего возраста, суд также учитывает применение к осужденному принудительных мер медицинского характера, его отношение к лечению и результаты судебно-психиатрической экспертизы.
5. Лицо, отбывающее пожизненное лишение свободы, может быть освобождено условно-досрочно, если судом будет признано, что оно не нуждается в дальнейшем отбывании этого наказания и фактически отбыло не менее двадцати пяти лет лишения свободы. Условно-досрочное освобождение от дальнейшего отбывания пожизненного лишения свободы применяется только при отсутствии у осужденного злостных нарушений установленного порядка отбывания наказания в течение предшествующих трех лет. Лицо, отбывающее пожизненное лишение свободы за совершение преступления, предусмотренного статьей 205, 205.1, 205.3, 205.4, 205.5, 279 или 361 настоящего Кодекса, либо совершившее в период отбывания пожизненного лишения свободы новое тяжкое или особо тяжкое преступление, условно-досрочному освобождению не подлежит.
6. Контроль за поведением лица, освобожденного условно-досрочно, осуществляется уполномоченным на то специализированным государственным органом, а в отношении военнослужащих - командованием воинских частей и учреждений.
7. Если в течение оставшейся не отбытой части наказания:
а) осужденный совершил нарушение общественного порядка, за которое на него было наложено административное взыскание, или злостно уклонился от исполнения обязанностей, возложенных на него судом при применении условно-досрочного освобождения, а равно от назначенных судом принудительных мер медицинского характера, суд по представлению органов, указанных в части шестой настоящей статьи, может постановить об отмене условно-досрочного освобождения и исполнении оставшейся не отбытой части наказания;
б) осужденный совершил преступление по неосторожности либо умышленное преступление небольшой или средней тяжести, вопрос об отмене либо о сохранении условно-досрочного освобождения решается судом;
в) осужденный совершил тяжкое или особо тяжкое преступление, суд назначает ему наказание по правилам, предусмотренным статьей 70 настоящего Кодекса. По этим же правилам назначается наказание в случаях совершения преступления по неосторожности либо умышленного преступления небольшой или средней тяжести, если суд отменяет условно-досрочное освобождение.`,
[["Шпаргалка по срокам","Небольшой и средней тяжести — 1/3; тяжкие — 1/2; особо тяжкие и повторное УДО после отмены — 2/3; половые против несовершеннолетних, тяжкие наркотические, терроризм, ст. 210 — 3/4; половые против детей до 14 лет — 4/5; пожизненное — 25 лет. В любом случае не менее 6 месяцев лишения свободы."],
 ["Условия","Суд признаёт, что лицо не нуждается в полном отбывании наказания, и лицо (полностью или частично) возместило вред. Учитывается поведение за весь срок, а не только последние месяцы."],
 ["Отмена (ч. 7)","Административное правонарушение или уклонение от обязанностей — может отменить. Новое тяжкое или особо тяжкое преступление — наказание по ст. 70."]]);
A("80",`1. Лицу, отбывающему содержание в дисциплинарной воинской части, принудительные работы или лишение свободы, возместившему вред (полностью или частично), причиненный преступлением, суд с учетом его поведения в течение всего периода отбывания наказания может заменить оставшуюся не отбытой часть наказания более мягким видом наказания, за исключением случаев замены наказания в виде лишения свободы принудительными работами в соответствии с частью второй настоящей статьи. При этом лицо может быть полностью или частично освобождено от отбывания дополнительного вида наказания.
2. Неотбытая часть наказания может быть заменена более мягким видом наказания после фактического отбытия осужденным к лишению свободы за совершение:
преступления небольшой или средней тяжести - не менее одной трети срока наказания либо не менее одной четвертой срока наказания при замене наказания в виде лишения свободы принудительными работами;
тяжкого преступления - не менее половины срока наказания либо не менее одной трети срока наказания при замене наказания в виде лишения свободы принудительными работами;
особо тяжкого преступления - не менее двух третей срока наказания;
преступлений против половой неприкосновенности несовершеннолетних, а также преступлений, предусмотренных статьей 210 настоящего Кодекса, - не менее трех четвертей срока наказания;
преступлений против половой неприкосновенности несовершеннолетних, не достигших четырнадцатилетнего возраста, - не менее четырех пятых срока наказания.
2.1. Неотбытая часть наказания может быть заменена более мягким видом наказания после фактического отбытия осужденными беременной женщиной или женщиной, имеющей ребенка в возрасте до четырех лет, находящегося в доме ребенка исправительного учреждения, к лишению свободы за совершение преступления небольшой тяжести не менее одной четверти срока наказания.
3. При замене неотбытой части наказания суд может избрать любой более мягкий вид наказания в соответствии с видами наказаний, указанными в статье 44 настоящего Кодекса, в пределах, предусмотренных настоящим Кодексом для каждого вида наказания, за исключением случаев замены наказания в виде лишения свободы принудительными работами в соответствии с частью второй настоящей статьи.
4. При рассмотрении ходатайства осужденного или представления администрации учреждения или органа, исполняющего наказание, о замене ему неотбытой части наказания более мягким видом наказания суд учитывает поведение осужденного, его отношение к учебе и труду в течение всего периода отбывания наказания, отношение осужденного к совершенному деянию и то, что осужденный частично или полностью возместил причиненный ущерб или иным образом загладил вред, причиненный в результате преступления. В отношении осужденного, страдающего расстройством сексуального предпочтения (педофилией), не исключающим вменяемости, и совершившего в возрасте старше восемнадцати лет преступление против половой неприкосновенности несовершеннолетнего, не достигшего четырнадцатилетнего возраста, суд также учитывает применение к осужденному принудительных мер медицинского характера, его отношение к лечению и результаты судебно-психиатрической экспертизы.`,
[["Кратко","Вместо досрочного освобождения неотбытая часть заменяется более мягким наказанием, например исправительными или принудительными работами."],
 ["Сроки","Небольшой и средней тяжести — 1/3 (1/4 при замене на принудительные работы); тяжкие — 1/2 (1/3 при замене на принудительные работы); особо тяжкие — 2/3; половые против несовершеннолетних и ст. 210 — 3/4; против детей до 14 лет — 4/5."],
 ["Отличие от УДО","При УДО человек освобождается условно и может вернуться досиживать. При замене он продолжает отбывать наказание, но более мягкое."]]);
A("80.1",`Лицо, впервые совершившее преступление небольшой или средней тяжести, освобождается судом от наказания, если будет установлено, что вследствие изменения обстановки это лицо или совершенное им преступление перестали быть общественно опасными.`,
[["Кратко","Суд признаёт лицо виновным, но освобождает от наказания, если из-за изменения обстановки лицо или деяние перестали быть общественно опасными."],
 ["Пример","Изменение закона или экономической ситуации, в которой деяние перестало быть опасным; лицо поступило на службу или изменило образ жизни."],
 ["Важно","Раньше это было основание освобождения от ответственности (ст. 77, утратила силу), теперь — от наказания."]]);
A("80.2",`1. Лицо, отбывающее наказание за совершение преступления, кроме преступлений, исключение в отношении которых предусмотрено частью первой статьи 78.1 настоящего Кодекса, призванное на военную службу в период мобилизации или в военное время в Вооруженные Силы Российской Федерации либо заключившее в период мобилизации, в период военного положения или в военное время контракт о прохождении военной службы в Вооруженных Силах Российской Федерации, освобождается от наказания условно. Контроль за поведением такого лица осуществляется командованием воинской части (учреждения).
2. Лицо, освобожденное от наказания условно в соответствии с частью первой настоящей статьи, освобождается от наказания:
а) со дня награждения государственной наградой, полученной в период прохождения военной службы;
б) со дня увольнения с военной службы по основанию, предусмотренному подпунктом "а", "в" или "о" пункта 1 статьи 51 Федерального закона от 28 марта 1998 года N 53-ФЗ "О воинской обязанности и военной службе".
3. Если в период прохождения военной службы лицо, освобожденное от наказания условно в соответствии с частью первой настоящей статьи, совершило новое преступление, суд назначает ему наказание по правилам, предусмотренным статьей 70 настоящего Кодекса.`,
[["Кратко","Аналог ст. 78.1, но для уже осуждённых: при призыве в период мобилизации или военное время либо контракте осуждённый освобождается от наказания условно, а окончательно — после награждения или увольнения по указанным основаниям."],
 ["Новое преступление","Во время службы — наказание по совокупности приговоров (ст. 70)."]]);
A("81",`1. Лицо, у которого после совершения преступления наступило психическое расстройство, лишающее его возможности осознавать фактический характер и общественную опасность своих действий (бездействия) либо руководить ими, освобождается от наказания, а лицо, отбывающее наказание, освобождается от дальнейшего его отбывания. Таким лицам суд может назначить принудительные меры медицинского характера.
2. Лицо, заболевшее после совершения преступления иной тяжелой болезнью, препятствующей отбыванию наказания, может быть судом освобождено от отбывания наказания.
3. Военнослужащие, отбывающие арест либо содержание в дисциплинарной воинской части, освобождаются от дальнейшего отбывания наказания в случае заболевания, делающего их негодными к военной службе. Неотбытая часть наказания может быть заменена им более мягким видом наказания.
4. Лица, указанные в частях первой и второй настоящей статьи, в случае их выздоровления могут подлежать уголовной ответственности и наказанию, если не истекли сроки давности, предусмотренные статьями 78 и 83 настоящего Кодекса.`,
[["Три случая","Психическое расстройство после преступления — освобождение обязательно. Иная тяжёлая болезнь — на усмотрение суда (перечень утверждает Правительство РФ). Военнослужащий стал негоден к службе — освобождение обязательно."],
 ["Отличие от невменяемости","Невменяемость (ст. 21) — во время деяния. Здесь расстройство наступило после преступления."],
 ["Ч. 4","При выздоровлении лицо может быть привлечено к ответственности, если не истекли сроки давности."]]);
A("82",`1. Беременной женщине, женщине, имеющей ребенка в возрасте до четырнадцати лет, мужчине, имеющему ребенка в возрасте до четырнадцати лет и являющемуся единственным родителем, кроме лиц, которым назначено наказание в виде лишения свободы за преступления против половой неприкосновенности несовершеннолетних, не достигших четырнадцатилетнего возраста, лишения свободы на срок свыше пяти лет за тяжкие и особо тяжкие преступления против личности, лишения свободы за преступления, предусмотренные статьями 205, 205.1, 205.2, 205.3, 205.4 и 205.5, частями третьей и четвертой статьи 206, частью четвертой статьи 211, статьей 361 настоящего Кодекса, и сопряженные с осуществлением террористической деятельности преступления, предусмотренные статьями 277, 278, 279 и 360 настоящего Кодекса, суд может отсрочить реальное отбывание наказания до достижения ребенком четырнадцатилетнего возраста.
2. В случае, если осужденный, указанный в части первой настоящей статьи, отказался от ребенка или продолжает уклоняться от обязанностей по воспитанию ребенка после предупреждения, объявленного органом, осуществляющим контроль за поведением осужденного, в отношении которого отбывание наказания отсрочено, суд может по представлению этого органа отменить отсрочку отбывания наказания и направить осужденного для отбывания наказания в место, назначенное в соответствии с приговором суда.
3. По достижении ребенком четырнадцатилетнего возраста суд освобождает осужденного, указанного в части первой настоящей статьи, от отбывания наказания или оставшейся части наказания со снятием судимости либо заменяет оставшуюся часть наказания более мягким видом наказания.
4. Если до достижения ребенком четырнадцатилетнего возраста истек срок, равный сроку наказания, отбывание которого было отсрочено, и орган, осуществляющий контроль за поведением осужденного, в отношении которого отбывание наказания отсрочено, пришел к выводу о соблюдении осужденным, указанным в части первой настоящей статьи, условий отсрочки и его исправлении, суд по представлению этого органа может принять решение о сокращении срока отсрочки отбывания наказания и об освобождении осужденного от отбывания наказания или оставшейся части наказания со снятием судимости.
5. Если в период отсрочки отбывания наказания осужденный, указанный в части первой настоящей статьи, совершает преступление по неосторожности либо умышленное преступление небольшой или средней тяжести, вопрос об отмене либо о сохранении отсрочки отбывания наказания решается судом. При сохранении отсрочки отбывания наказания по первому приговору суд вправе применить отсрочку отбывания наказания и по второму приговору в случаях, предусмотренных частью первой настоящей статьи.
6. Если в период отсрочки отбывания наказания осужденный, указанный в части первой настоящей статьи, совершает умышленное тяжкое или особо тяжкое преступление, суд отменяет отсрочку отбывания наказания и назначает осужденному наказание по правилам, предусмотренным статьей 70 настоящего Кодекса. По этим же правилам назначается наказание в случаях отмены отсрочки отбывания наказания, предусмотренных частью пятой настоящей статьи.`,
[["Кому","Беременной женщине, женщине с ребёнком до 14 лет, мужчине — единственному родителю ребёнка до 14 лет. Отсрочка — до 14-летия ребёнка."],
 ["Кому нельзя","Осуждённым за половые преступления против детей до 14 лет, к лишению свободы свыше 5 лет за тяжкие и особо тяжкие против личности, за терроризм и другие преступления из ч. 1."],
 ["Итог","После 14-летия ребёнка суд освобождает от наказания со снятием судимости или заменяет его более мягким. Досрочно — если прошёл срок, равный сроку наказания, и условия соблюдались (ч. 4)."]]);
A("83",`1. Лицо, осужденное за совершение преступления, освобождается от отбывания наказания, если обвинительный приговор суда не был приведен в исполнение в следующие сроки со дня вступления его в законную силу:
а) два года при осуждении за преступление небольшой тяжести;
б) шесть лет при осуждении за преступление средней тяжести;
в) десять лет при осуждении за тяжкое преступление;
г) пятнадцать лет при осуждении за особо тяжкое преступление.
2. Течение сроков давности приостанавливается, если осужденный уклоняется от отбывания наказания. В этом случае течение сроков давности возобновляется с момента задержания осужденного или явки его с повинной. Сроки давности, истекшие к моменту уклонения осужденного от отбывания наказания, подлежат зачету.
2.1. Течение сроков давности приостанавливается, если осужденному предоставлена отсрочка отбывания наказания. В этом случае течение сроков давности возобновляется с момента окончания срока отсрочки отбывания наказания, за исключением случаев, предусмотренных частями третьей и четвертой статьи 82 и частью третьей статьи 82.1 настоящего Кодекса, либо с момента отмены отсрочки отбывания наказания.
3. Вопрос о применении сроков давности к лицу, осужденному к смертной казни или пожизненному лишению свободы, решается судом. Если суд не сочтет возможным применить сроки давности, эти виды наказаний заменяются лишением свободы на определенный срок.
4. К лицам, осужденным за совершение преступлений, предусмотренных статьями 205, 205.1, 205.3, 205.4, 205.5, частями третьей и четвертой статьи 206, частью четвертой статьи 211, статьями 281 - 281.3, 353, 356, 357, 358 и 361 настоящего Кодекса, а равно осужденным за совершение сопряженных с осуществлением террористической деятельности преступлений, предусмотренных статьями 277, 278, 279 и 360 настоящего Кодекса, сроки давности не применяются.`,
[["Кратко","Давность исполнения приговора: те же сроки 2, 6, 10, 15 лет, но считаются со дня вступления приговора в законную силу."],
 ["Отличие от ст. 78","Ст. 78 — давность привлечения к ответственности (до приговора). Ст. 83 — давность исполнения уже вынесенного приговора."],
 ["Приостановление","Уклонение от отбывания наказания и отсрочка (ч. 2.1) приостанавливают срок; истёкшая до уклонения часть засчитывается."]]);
A("84",`1. Амнистия объявляется Государственной Думой Федерального Собрания Российской Федерации в отношении индивидуально не определенного круга лиц.
2. Актом об амнистии лица, совершившие преступления, могут быть освобождены от уголовной ответственности. Лица, осужденные за совершение преступлений, могут быть освобождены от наказания, либо назначенное им наказание может быть сокращено или заменено более мягким видом наказания, либо такие лица могут быть освобождены от дополнительного вида наказания. С лиц, отбывших наказание, актом об амнистии может быть снята судимость.`,
[["Кратко","Амнистию объявляет Государственная Дума постановлением, для неопределённого круга лиц (по категориям: например, несовершеннолетние, ветераны, осуждённые за нетяжкие преступления)."],
 ["Отличие от помилования","Помилование — Президент, конкретному лицу. Амнистия — Госдума, неопределённому кругу лиц."]]);
A("85",`1. Помилование осуществляется Президентом Российской Федерации в отношении индивидуально определенного лица.
2. Актом помилования лицо, осужденное за преступление, может быть освобождено от дальнейшего отбывания наказания либо назначенное ему наказание может быть сокращено или заменено более мягким видом наказания. С лица, отбывшего наказание, актом помилования может быть снята судимость.`,
[["Кратко","Помилование — указ Президента РФ в отношении конкретного осуждённого."],
 ["Важно","Помилование, в отличие от амнистии, не может освободить от уголовной ответственности: оно касается только уже осуждённых."]]);
A("86",`1. Лицо, осужденное за совершение преступления, считается судимым со дня вступления обвинительного приговора суда в законную силу до момента погашения или снятия судимости. Судимость в соответствии с настоящим Кодексом учитывается при рецидиве преступлений, назначении наказания и влечет за собой иные правовые последствия в случаях и в порядке, которые установлены федеральными законами.
2. Лицо, освобожденное от наказания, считается несудимым.
3. Судимость погашается:
а) в отношении лиц, условно осужденных, - по истечении испытательного срока;
б) в отношении лиц, осужденных к более мягким видам наказаний, чем лишение свободы, - по истечении одного года после отбытия или исполнения наказания;
в) в отношении лиц, осужденных к лишению свободы за преступления небольшой или средней тяжести, - по истечении трех лет после отбытия наказания;
г) в отношении лиц, осужденных к лишению свободы за тяжкие преступления, - по истечении восьми лет после отбытия наказания;
д) в отношении лиц, осужденных за особо тяжкие преступления, - по истечении десяти лет после отбытия наказания.
3.1. В отношении лица, имеющего судимость, кроме судимости за совершение преступлений, исключение в отношении которых предусмотрено частью первой статьи 78.1 настоящего Кодекса, призванного на военную службу в период мобилизации или в военное время в Вооруженные Силы Российской Федерации либо заключившего в период мобилизации, в период военного положения или в военное время контракт о прохождении военной службы в Вооруженных Силах Российской Федерации, судимость погашается:
а) со дня награждения государственной наградой, полученной в период прохождения военной службы;
б) со дня увольнения с военной службы по основанию, предусмотренному подпунктом "а", "в" или "о" пункта 1 статьи 51 Федерального закона от 28 марта 1998 года N 53-ФЗ "О воинской обязанности и военной службе".
4. Если осужденный в установленном законом порядке был досрочно освобожден от отбывания наказания или неотбытая часть наказания была заменена более мягким видом наказания, то срок погашения судимости исчисляется исходя из фактически отбытого срока наказания с момента освобождения от отбывания основного и дополнительного видов наказаний.
5. Если осужденный после отбытия наказания вел себя безупречно, а также возместил вред, причиненный преступлением, то по его ходатайству суд может снять с него судимость до истечения срока погашения судимости.
6. Погашение или снятие судимости аннулирует все правовые последствия, предусмотренные настоящим Кодексом, связанные с судимостью.`,
[["Шпаргалка по погашению","Условное осуждение — по истечении испытательного срока; наказание мягче лишения свободы — 1 год; лишение свободы за небольшой и средней тяжести — 3 года; за тяжкие — 8 лет; за особо тяжкие — 10 лет. Сроки считаются после отбытия наказания (основного и дополнительного)."],
 ["Погашение и снятие","Погашение — автоматически по истечении срока. Снятие — досрочно, по решению суда (ч. 5), по амнистии или помилованию."],
 ["Важно","Наличие судимости определяется на момент совершения нового преступления, а не на момент приговора."]]);
// Часть: ст. 82.1, раздел V (ст. 87–96). Тексты сверены с КонсультантПлюс, ред. от 04.08.2026
A("82.1",`1. Осужденному, которому впервые назначено наказание в виде лишения свободы за совершение преступления, предусмотренного частью первой статьи 228, частью первой статьи 231 и статьей 233 настоящего Кодекса, признанному больным наркоманией и изъявившему желание добровольно пройти курс лечения от наркомании, а также медицинскую реабилитацию, социальную реабилитацию, суд может отсрочить отбывание наказания в виде лишения свободы до окончания лечения и медицинской реабилитации, социальной реабилитации, но не более чем на пять лет.
2. В случае, если осужденный, признанный больным наркоманией, отбывание наказания которому отсрочено, отказался от прохождения курса лечения от наркомании, а также медицинской реабилитации либо социальной реабилитации или уклоняется от лечения после предупреждения, объявленного органом, осуществляющим контроль за поведением осужденного, суд по представлению этого органа отменяет отсрочку отбывания наказания и направляет осужденного для отбывания наказания в место, назначенное в соответствии с приговором суда.
3. После прохождения курса лечения от наркомании, медицинской реабилитации, социальной реабилитации и при наличии объективно подтвержденной ремиссии, длительность которой после окончания лечения, медицинской реабилитации, социальной реабилитации составляет не менее двух лет, суд освобождает осужденного, признанного больным наркоманией, от отбывания наказания или оставшейся части наказания.
4. В случае установления судом факта совершения осужденным, признанным больным наркоманией, отбывание наказания которому отсрочено, преступления, не указанного в части первой настоящей статьи, суд по представлению органа, осуществляющего контроль за поведением осужденного, отменяет отсрочку отбывания наказания, назначает наказание по правилам, предусмотренным частью пятой статьи 69 настоящего Кодекса, и направляет осужденного для отбывания наказания в место, назначенное в соответствии с приговором суда.
5. В случае, если в период отсрочки отбывания наказания осужденный, признанный больным наркоманией, совершил новое преступление, суд отменяет отсрочку отбывания наказания, назначает ему наказание по правилам, предусмотренным статьей 70 настоящего Кодекса, и направляет осужденного в место, назначенное в соответствии с приговором суда.`,
[["Кому","Только осуждённому к реальному лишению свободы впервые за ч. 1 ст. 228, ч. 1 ст. 231 или ст. 233, признанному больным наркоманией и добровольно согласившемуся на лечение, медицинскую и социальную реабилитацию. Отсрочка — до окончания лечения и реабилитации, но не более пяти лет."],
 ["Итог","После лечения и реабилитации при объективно подтверждённой ремиссии не менее двух лет суд обязан освободить от наказания (ч. 3). Отказ от лечения или уклонение после предупреждения ведут к отмене отсрочки и реальному лишению свободы (ч. 2)."],
 ["Частая ошибка","Путают ч. 4 и ч. 5. Ч. 4 — выяснилось, что лицо ещё до первого приговора совершило другое преступление, не из ч. 1: наказание по ч. 5 ст. 69. Ч. 5 — новое преступление в период отсрочки: наказание по ст. 70."]]);
A("87",`1. Несовершеннолетними признаются лица, которым ко времени совершения преступления исполнилось четырнадцать, но не исполнилось восемнадцати лет.
2. К несовершеннолетним, совершившим преступления, могут быть применены принудительные меры воспитательного воздействия либо им может быть назначено наказание, а при освобождении от наказания судом они могут быть также помещены в специальное учебно-воспитательное учреждение закрытого типа.`,
[["Кратко","Несовершеннолетний — лицо, которому ко времени совершения преступления исполнилось 14, но не исполнилось 18 лет. К нему можно применить принудительные меры воспитательного воздействия, назначить наказание, а при освобождении от наказания — поместить в специальное учебно-воспитательное учреждение закрытого типа."],
 ["Важно","Возраст берётся на момент совершения преступления, а не приговора. Если к суду лицу исполнилось 18, правила главы 14 всё равно применяются к тому, что оно совершило до 18."],
 ["Частая ошибка","Смешивают ст. 20 и ст. 87. Ст. 20 отвечает на вопрос, подлежит ли лицо ответственности вообще (с 16 лет, по перечню — с 14). Ст. 87 и вся глава 14 — как именно отвечает тот, кто уже подлежит ответственности."]]);
A("88",`1. Видами наказаний, назначаемых несовершеннолетним, являются:
а) штраф;
б) лишение права заниматься определенной деятельностью;
в) обязательные работы;
г) исправительные работы;
д) ограничение свободы;
е) лишение свободы на определенный срок.
2. Штраф назначается как при наличии у несовершеннолетнего осужденного самостоятельного заработка или имущества, на которое может быть обращено взыскание, так и при отсутствии таковых. Штраф, назначенный несовершеннолетнему осужденному, по решению суда может взыскиваться с его родителей или иных законных представителей с их согласия. Штраф назначается в размере от одной тысячи до пятидесяти тысяч рублей или в размере заработной платы или иного дохода несовершеннолетнего осужденного за период от двух недель до шести месяцев.
3. Обязательные работы назначаются на срок от сорока до ста шестидесяти часов, заключаются в выполнении работ, посильных для несовершеннолетнего, и исполняются им в свободное от учебы или основной работы время. Продолжительность исполнения данного вида наказания лицами в возрасте до пятнадцати лет не может превышать двух часов в день, а лицами в возрасте от пятнадцати до шестнадцати лет - трех часов в день.
4. Исправительные работы назначаются несовершеннолетним осужденным на срок до одного года.
5. Ограничение свободы назначается несовершеннолетним осужденным в виде основного наказания на срок от двух месяцев до двух лет.
6. Наказание в виде лишения свободы назначается несовершеннолетним осужденным, совершившим преступления в возрасте до шестнадцати лет, на срок не свыше шести лет. Этой же категории несовершеннолетних, совершивших особо тяжкие преступления, а также остальным несовершеннолетним осужденным наказание назначается на срок не свыше десяти лет и отбывается в воспитательных колониях. Наказание в виде лишения свободы не может быть назначено несовершеннолетнему осужденному, совершившему в возрасте до шестнадцати лет преступление небольшой или средней тяжести впервые, а также остальным несовершеннолетним осужденным, совершившим преступления небольшой тяжести впервые.
6.1. При назначении несовершеннолетнему осужденному наказания в виде лишения свободы за совершение тяжкого либо особо тяжкого преступления низший предел наказания, предусмотренный соответствующей статьей Особенной части настоящего Кодекса, сокращается наполовину.
6.2. В случае, если несовершеннолетний осужденный, которому назначено условное осуждение, совершил в течение испытательного срока новое преступление, не являющееся особо тяжким, суд с учетом обстоятельств дела и личности виновного может повторно принять решение об условном осуждении, установив новый испытательный срок и возложив на условно осужденного исполнение определенных обязанностей, предусмотренных частью пятой статьи 73 настоящего Кодекса.
7. Суд может дать указание органу, исполняющему наказание, об учете при обращении с несовершеннолетним осужденным определенных особенностей его личности.`,
[["Шпаргалка","Штраф — 1–50 тыс. руб. или доход за 2 недели — 6 месяцев; обязательные работы — 40–160 часов; исправительные работы — до 1 года; ограничение свободы — только основное, 2 месяца — 2 года; лишение свободы — до 6 лет (если преступление совершено до 16 лет и оно не особо тяжкое), в остальных случаях до 10 лет, в воспитательной колонии."],
 ["Когда лишение свободы нельзя","Если до 16 лет впервые совершено преступление небольшой или средней тяжести, а в 16–17 лет — впервые небольшой тяжести. За тяжкие и особо тяжкие нижний предел лишения свободы по санкции сокращается вдвое (ч. 6.1)."],
 ["Чего нет в перечне","Лишения права занимать должности (есть только лишение права заниматься деятельностью), лишения званий, принудительных работ, ареста, пожизненного лишения свободы и смертной казни. Эти наказания несовершеннолетним не назначаются."]]);
A("89",`1. При назначении наказания несовершеннолетнему кроме обстоятельств, предусмотренных статьей 60 настоящего Кодекса, учитываются условия его жизни и воспитания, уровень психического развития, иные особенности личности, а также влияние на него старших по возрасту лиц.
2. Несовершеннолетний возраст как смягчающее обстоятельство учитывается в совокупности с другими смягчающими и отягчающими обстоятельствами.`,
[["Кратко","К общим началам ст. 60 добавляются условия жизни и воспитания, уровень психического развития, иные особенности личности и влияние старших по возрасту лиц."],
 ["Важно","Несовершеннолетие — смягчающее обстоятельство (п. «б» ч. 1 ст. 61), но не решающее: суд оценивает его вместе с другими смягчающими и отягчающими обстоятельствами (ч. 2)."],
 ["Пример","Подросток совершил кражу по указанию взрослого знакомого. Влияние старшего учитывается при назначении наказания, при зависимости или принуждении есть смягчающее обстоятельство п. «е» ч. 1 ст. 61, а взрослый может отвечать по ст. 150."]]);
A("90",`1. Несовершеннолетний, совершивший преступление небольшой или средней тяжести, может быть освобожден от уголовной ответственности, если будет признано, что его исправление может быть достигнуто путем применения принудительных мер воспитательного воздействия.
2. Несовершеннолетнему могут быть назначены следующие принудительные меры воспитательного воздействия:
а) предупреждение;
б) передача под надзор родителей или лиц, их заменяющих, либо специализированного государственного органа;
в) возложение обязанности загладить причиненный вред;
г) ограничение досуга и установление особых требований к поведению несовершеннолетнего.
3. Несовершеннолетнему может быть назначено одновременно несколько принудительных мер воспитательного воздействия. Срок применения принудительных мер воспитательного воздействия, предусмотренных пунктами "б" и "г" части второй настоящей статьи, устанавливается продолжительностью от одного месяца до двух лет при совершении преступления небольшой тяжести и от шести месяцев до трех лет - при совершении преступления средней тяжести.
4. В случае систематического неисполнения несовершеннолетним принудительной меры воспитательного воздействия эта мера по представлению специализированного государственного органа отменяется и материалы направляются для привлечения несовершеннолетнего к уголовной ответственности.`,
[["Кратко","Это освобождение от уголовной ответственности: приговора и судимости нет. Возможно только за преступления небольшой и средней тяжести. Можно назначить одновременно несколько мер."],
 ["Сроки","Надзор (п. «б») и ограничение досуга (п. «г»): от 1 месяца до 2 лет — за преступление небольшой тяжести, от 6 месяцев до 3 лет — средней тяжести. Предупреждение и заглаживание вреда срока не имеют."],
 ["Отличие от ст. 92","По ст. 90 дело прекращается без приговора. По ч. 1 ст. 92 сначала выносится обвинительный приговор, а затем лицо освобождается от наказания с теми же мерами."]]);
A("91",`1. Предупреждение состоит в разъяснении несовершеннолетнему вреда, причиненного его деянием, и последствий повторного совершения преступлений, предусмотренных настоящим Кодексом.
2. Передача под надзор состоит в возложении на родителей или лиц, их заменяющих, либо на специализированный государственный орган обязанности по воспитательному воздействию на несовершеннолетнего и контролю за его поведением.
3. Обязанность загладить причиненный вред возлагается с учетом имущественного положения несовершеннолетнего и наличия у него соответствующих трудовых навыков.
4. Ограничение досуга и установление особых требований к поведению несовершеннолетнего могут предусматривать запрет посещения определенных мест, использования определенных форм досуга, в том числе связанных с управлением механическим транспортным средством, ограничение пребывания вне дома после определенного времени суток, выезда в другие местности без разрешения специализированного государственного органа. Несовершеннолетнему может быть предъявлено также требование возвратиться в образовательную организацию либо трудоустроиться с помощью специализированного государственного органа. Настоящий перечень не является исчерпывающим.`,
[["Кратко","Предупреждение — разъяснение вреда и последствий повторного преступления. Надзор — обязанность родителей (лиц, их заменяющих) или специализированного органа воспитывать и контролировать. Заглаживание вреда — с учётом имущества и трудовых навыков подростка."],
 ["Важно","Перечень ограничений досуга в ч. 4 открытый: суд может установить и иные требования к поведению, например вернуться в образовательную организацию или трудоустроиться с помощью специализированного органа."]]);
A("92",`1. Несовершеннолетний, осужденный за совершение преступления небольшой или средней тяжести, может быть освобожден судом от наказания с применением принудительных мер воспитательного воздействия, предусмотренных частью второй статьи 90 настоящего Кодекса.
2. Несовершеннолетний, осужденный к лишению свободы за совершение преступления средней тяжести, а также тяжкого преступления, может быть освобожден судом от наказания и помещен в специальное учебно-воспитательное учреждение закрытого типа. Помещение в специальное учебно-воспитательное учреждение закрытого типа применяется как принудительная мера воспитательного воздействия в целях исправления несовершеннолетнего, нуждающегося в особых условиях воспитания, обучения и требующего специального педагогического подхода. Несовершеннолетний может быть помещен в указанное учреждение до достижения им возраста восемнадцати лет, но не более чем на три года.
3 - 4. Части утратили силу.
5. Несовершеннолетние, совершившие преступления, предусмотренные частями первой и второй статьи 111, частью второй статьи 117, частью третьей статьи 122, частью первой статьи 126, частью третьей статьи 127, частью второй статьи 131, частью второй статьи 132, частью четвертой статьи 158, частью второй статьи 161, частями первой и второй статьи 162, частью второй статьи 163, частью первой статьи 205.1, статьей 205.2, частью второй статьи 205.4, частью первой статьи 206, частью второй статьи 208, частью второй статьи 210, частью первой статьи 211, частями второй и третьей статьи 223, частями первой и второй статьи 226, частью первой статьи 228.1, частями первой и второй статьи 229, частью первой статьи 281.1, частью второй статьи 281.3, статьей 360 настоящего Кодекса, освобождению от наказания в порядке, предусмотренном частью второй настоящей статьи, не подлежат.`,
[["Два варианта","Ч. 1: небольшой или средней тяжести — освобождение от наказания с мерами из ч. 2 ст. 90. Ч. 2: средней тяжести или тяжкое при осуждении к лишению свободы — освобождение с помещением в спецучреждение закрытого типа до 18 лет, но не более чем на 3 года."],
 ["Кому нельзя в спецучреждение","Ч. 5 перечисляет составы (например, ч. 1 и 2 ст. 111, ч. 4 ст. 158, ч. 2 ст. 161, ч. 1 и 2 ст. 162, террористические), при которых освобождение по ч. 2 невозможно. На ч. 1 этот запрет не распространяется."],
 ["Важно","Части 3 и 4 утратили силу (Федеральный закон от 21.11.2022 N 446-ФЗ). Ч. 5 действует в редакции Федерального закона от 17.11.2025 N 420-ФЗ."]]);
A("93",`1. Условно-досрочное освобождение от отбывания наказания может быть применено к лицу, совершившему преступление в несовершеннолетнем возрасте, осужденному к лишению свободы, после фактического отбытия:
а) не менее одной трети срока наказания, назначенного судом за преступление небольшой или средней тяжести либо за тяжкое преступление;
б) не менее двух третей срока наказания, назначенного судом за особо тяжкое преступление.
2. Условно-досрочное освобождение от отбывания наказания может быть применено к осужденным к лишению свободы беременной женщине или женщине, имеющей ребенка в возрасте до четырех лет, находящегося в доме ребенка исправительного учреждения, совершившим преступление в несовершеннолетнем возрасте, после фактического отбытия не менее одной четверти срока наказания, назначенного судом за преступление небольшой тяжести.`,
[["Кратко","УДО для лиц, совершивших преступление до 18 лет, осуждённых к лишению свободы: после 1/3 срока — за небольшой, средней тяжести и тяжкие, после 2/3 — за особо тяжкие."],
 ["Сравнение со ст. 79","У взрослых за тяжкие нужно отбыть 1/2 срока, у несовершеннолетних — 1/3. Льгота зависит от возраста на момент преступления: к моменту УДО лицо может быть уже взрослым."],
 ["Ч. 2","Беременная или женщина с ребёнком до 4 лет в доме ребёнка исправительного учреждения, совершившая преступление небольшой тяжести до 18 лет, — после 1/4 срока."]]);
A("94",`Сроки давности, предусмотренные статьями 78 и 83 настоящего Кодекса, при освобождении несовершеннолетних от уголовной ответственности или от отбывания наказания сокращаются наполовину.`,
[["Шпаргалка","Сроки ст. 78 и 83 делятся пополам: 1 год (небольшой тяжести), 3 года (средней), 5 лет (тяжкие), 7,5 года (особо тяжкие)."],
 ["Важно","Сокращение касается и давности привлечения к ответственности (ст. 78), и давности исполнения приговора (ст. 83). Возраст определяется на момент совершения преступления."]]);
A("95",`Для лиц, совершивших преступления до достижения возраста восемнадцати лет, сроки погашения судимости, предусмотренные частью третьей статьи 86 настоящего Кодекса, сокращаются и соответственно равны:
а) шести месяцам после отбытия или исполнения наказания более мягкого, чем лишение свободы;
б) одному году после отбытия лишения свободы за преступление небольшой или средней тяжести;
в) трем годам после отбытия лишения свободы за тяжкое или особо тяжкое преступление.`,
[["Шпаргалка","Наказание мягче лишения свободы — 6 месяцев; лишение свободы за небольшой или средней тяжести — 1 год; за тяжкие и особо тяжкие — 3 года. Сроки считаются после отбытия наказания."],
 ["Важно","Условное осуждение в статье не названо, поэтому судимость погашается по общему правилу п. «а» ч. 3 ст. 86 — по истечении испытательного срока."],

const q=$("#q"),res=$("#res");
function search(v){
 v=v.trim().toLowerCase();if(!v){res.style.display="none";return}
 const out=[];
 const num=v.replace(/^ст\.?\s*/,"");
 if(/^\d+(\.\d+)?$/.test(num)){INDEX.filter(a=>a.n===num||a.n.startsWith(num+".")||(num.length>=2&&a.n.startsWith(num))).slice(0,12).forEach(a=>out.push({a,ctx:""}))}
 else if(v.length>=3){
  TABLES.forEach(t=>{const all=[t.title,...t.rows.flat()];const hit=all.find(s=>s.toLowerCase().includes(v));if(hit)out.push({t,ctx:hit===t.title?"":hit,score:-1})});
  INDEX.forEach(a=>{let ctx="",where="text";const inT=a.t.toLowerCase().includes(v);const f=FULL[a.n];
   if(f){const groups=[["text",f.text.map(x=>x[1])],["cm",f.comment.map(x=>x[1])],["cm",(PL[a.n]||[]).map(x=>x[1])]];
    for(const [w,arr] of groups){const hit=arr.find(s=>s.toLowerCase().includes(v));if(hit){const i=hit.toLowerCase().indexOf(v);ctx="…"+hit.slice(Math.max(0,i-40),i+60)+"…";where=w;break}}}
   if(inT||ctx)out.push({a,ctx,where:inT?"text":where,score:inT?0:1})});
  out.sort((x,y)=>x.score-y.score);
 }
