:root{--bg:#EDEFF2;--panel:#FFFFFF;--ink:#1A2130;--muted:#5E6778;--line:#D5D9E0;--accent:#7A1B28;--accent-soft:#F3E4E6;--hl:#FFF1B8;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161E;--panel:#1A202B;--ink:#E4E7EC;--muted:#98A1B2;--line:#2C3442;--accent:#E07A88;--accent-soft:#3A2228;--hl:#5A4A10}}
:root[data-theme="dark"]{--bg:#12161E;--panel:#1A202B;--ink:#E4E7EC;--muted:#98A1B2;--line:#2C3442;--accent:#E07A88;--accent-soft:#3A2228;--hl:#5A4A10}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px}
.app{display:grid;grid-template-columns:minmax(260px,340px) 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:"Lora",Georgia,serif;font-weight:700;font-size:20px;white-space:nowrap}
.brand small{display:block;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:400;font-size:12px;color:var(--muted)}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:60vh;overflow:auto;z-index:5;display:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.results button:hover,.results button:focus{background:var(--accent-soft);outline:none}
.results .n{font-weight:700;color:var(--accent);margin-right:6px}
.results .ctx{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 10px;font:inherit;cursor:pointer;white-space:nowrap}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
nav{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0 40px}
.tabs{display:flex;gap:4px;padding:4px 12px 8px}
.tabs button{flex:1;padding:6px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.partname{font-family:"Lora",Georgia,serif;font-weight:700;padding:14px 16px 4px;font-size:17px}
details{border-top:1px solid transparent}
summary{cursor:pointer;padding:6px 16px;list-style:none;font-size:14px;line-height:1.35}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.sec>summary{font-weight:700;color:var(--ink)}
.ch>summary{padding-left:30px;color:var(--ink)}
.ch>summary .cn{color:var(--muted)}
.art{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 16px 5px 58px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.3}
.art:hover{background:var(--accent-soft)}
.art[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.art .an{font-weight:700;margin-right:4px}
.art.gone{color:var(--muted)}
.art .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.pending{padding:4px 16px 8px 58px;font-size:13px;color:var(--muted)}
main{overflow:auto;padding:28px 24px 60px}
.doc{max-width:760px;margin:0 auto}
.crumbs{font-size:13px;color:var(--muted);line-height:1.5}
h1{font-family:"Lora",Georgia,serif;font-size:30px;line-height:1.2;margin:10px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 18px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.star{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.star[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.viewtabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
.viewtabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.viewtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.law{font-family:"Lora",Georgia,serif;font-size:17px;line-height:1.7}
.law p{margin:0 0 10px}
.law .i{padding-left:28px;margin-bottom:4px}
.law .s{padding-left:28px;color:var(--muted);font-size:16px;margin-bottom:16px}
.law h3{font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;margin:26px 0 10px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.cm dt{font-weight:700;margin-top:18px;font-size:15px;color:var(--accent)}
.cm dd{margin:4px 0 0;font-family:"Lora",Georgia,serif;font-size:17px;line-height:1.65}
.rel{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.rel button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:5px 10px;margin:4px 6px 0 0;font:inherit;font-size:14px;cursor:pointer}
.note{margin-top:22px;padding:12px 14px;background:var(--accent-soft);border-radius:6px;font-size:14px;line-height:1.5}
.note a{color:var(--accent)}
.home h1{font-size:34px}
.home p{font-family:"Lora",Georgia,serif;font-size:17px;line-height:1.65;max-width:62ch}
.kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 16px}
.xref{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.xref:hover{text-decoration-thickness:2px}
.pl{margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
.pl h3{font-size:15px;color:var(--muted);margin:14px 0 8px}
.pl .doc-t{font-weight:700;font-size:15px;line-height:1.45;margin-top:12px}
.pl .doc-s{font-family:"Lora",Georgia,serif;font-size:17px;line-height:1.65;margin-top:4px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:15px;line-height:1.45}

A("13",`1. Граждане Российской Федерации, совершившие преступление на территории иностранного государства, не подлежат выдаче этому государству.

A("14",`1. Преступлением признается виновно совершенное общественно опасное деяние, запрещенное настоящим Кодексом под угрозой наказания.

 ["Важно","Малозначительность не применяется, если умысел был направлен на значительный результат, который не наступил по случайности: тогда это покушение."]]);
A("15",`1. В зависимости от характера и степени общественной опасности деяния, предусмотренные настоящим Кодексом, подразделяются на преступления небольшой тяжести, преступления средней тяжести, тяжкие преступления и особо тяжкие преступления.
2. Преступлениями небольшой тяжести признаются умышленные и неосторожные деяния, за совершение которых максимальное наказание, предусмотренное настоящим Кодексом, не превышает трех лет лишения свободы.
3. Преступлениями средней тяжести признаются умышленные деяния, за совершение которых максимальное наказание, предусмотренное настоящим Кодексом, не превышает пяти лет лишения свободы, и неосторожные деяния, за совершение которых максимальное наказание, предусмотренное настоящим Кодексом, не превышает десяти лет лишения свободы.
4. Тяжкими преступлениями признаются умышленные деяния, за совершение которых максимальное наказание, предусмотренное настоящим Кодексом, не превышает десяти лет лишения свободы, и неосторожные деяния, за совершение которых максимальное наказание, предусмотренное настоящим Кодексом, не превышает пятнадцати лет лишения свободы.
5. Особо тяжкими преступлениями признаются умышленные деяния, за совершение которых настоящим Кодексом предусмотрено наказание в виде лишения свободы на срок свыше десяти лет или более строгое наказание.
6. С учетом фактических обстоятельств преступления и степени его общественной опасности суд вправе при наличии смягчающих наказание обстоятельств и при отсутствии отягчающих наказание обстоятельств изменить категорию преступления на менее тяжкую, но не более чем на одну категорию преступления при условии, что за совершение преступления, указанного в части третьей настоящей статьи, осужденному назначено наказание, не превышающее трех лет лишения свободы, или другое более мягкое наказание; за совершение преступления, указанного в части четвертой настоящей статьи, осужденному назначено наказание, не превышающее пяти лет лишения свободы, или другое более мягкое наказание; за совершение преступления, указанного в части пятой настоящей статьи, осужденному назначено наказание, не превышающее семи лет лишения свободы.`,
[["Шпаргалка","Умышленные: небольшой тяжести до 3 лет, средней до 5, тяжкие до 10, особо тяжкие свыше 10. Неосторожные: небольшой тяжести до 3 лет, средней до 10, тяжкие до 15. Особо тяжких неосторожных не бывает."],
 ["Важно","Категорию определяют по максимальному сроку в санкции статьи, а не по наказанию, которое назначил суд."],

A("17",`1. Совокупностью преступлений признается совершение двух или более преступлений, ни за одно из которых лицо не было осуждено, за исключением случаев, когда совершение двух или более преступлений предусмотрено статьями Особенной части настоящего Кодекса в качестве обстоятельства, влекущего более строгое наказание. При совокупности преступлений лицо несет уголовную ответственность за каждое совершенное преступление по соответствующей статье или части статьи настоящего Кодекса.
2. Совокупностью преступлений признается и одно действие (бездействие), содержащее признаки преступлений, предусмотренных двумя или более статьями настоящего Кодекса.
3. Если преступление предусмотрено общей и специальной нормами, совокупность преступлений отсутствует и уголовная ответственность наступает по специальной норме.`,
[["Кратко","Реальная совокупность (ч. 1): несколько разных деяний, ни за одно нет приговора. Идеальная (ч. 2): одно действие подпадает под несколько статей."],
 ["Пример","Убил, а затем забрал у убитого телефон: реальная совокупность (ст. 105 и ст. 158). Выстрелом убил одного и ранил другого: идеальная совокупность."],
 ["Ч. 3","Конкуренция общей и специальной нормы решается в пользу специальной, совокупности нет. Например, убийство матерью новорождённого квалифицируется только по ст. 106, а не по ст. 105."]]);
A("18",`1. Рецидивом преступлений признается совершение умышленного преступления лицом, имеющим судимость за ранее совершенное умышленное преступление.
2. Рецидив преступлений признается опасным:
а) при совершении лицом тяжкого преступления, за которое оно осуждается к реальному лишению свободы, если ранее это лицо два или более раза было осуждено за умышленное преступление средней тяжести к лишению свободы;
б) при совершении лицом тяжкого преступления, если ранее оно было осуждено за тяжкое или особо тяжкое преступление к реальному лишению свободы.
3. Рецидив преступлений признается особо опасным:
а) при совершении лицом тяжкого преступления, за которое оно осуждается к реальному лишению свободы, если ранее это лицо два раза было осуждено за тяжкое преступление к реальному лишению свободы;
б) при совершении лицом особо тяжкого преступления, если ранее оно два раза было осуждено за тяжкое преступление или ранее осуждалось за особо тяжкое преступление.
4. При признании рецидива преступлений не учитываются:
а) судимости за умышленные преступления небольшой тяжести;
б) судимости за преступления, совершенные лицом в возрасте до восемнадцати лет;
в) судимости за преступления, осуждение за которые признавалось условным либо по которым предоставлялась отсрочка исполнения приговора, если условное осуждение или отсрочка исполнения приговора не отменялись и лицо не направлялось для отбывания наказания в места лишения свободы, а также судимости, снятые или погашенные в порядке, установленном статьей 86 настоящего Кодекса.
5. Рецидив преступлений влечет более строгое наказание на основании и в пределах, предусмотренных настоящим Кодексом, а также иные последствия, предусмотренные законодательством Российской Федерации.`,
[["Кратко","Рецидив: новое умышленное преступление при непогашенной судимости за прежнее умышленное. Виды: простой (ч. 1), опасный (ч. 2), особо опасный (ч. 3)."],
 ["Не учитываются","Судимости за умышленные преступления небольшой тяжести, за преступления до 18 лет, условные и отсроченные (если не отменялись), снятые и погашенные."],

A("20",`1. Уголовной ответственности подлежит лицо, достигшее ко времени совершения преступления шестнадцатилетнего возраста.
2. Лица, достигшие ко времени совершения преступления четырнадцатилетнего возраста, подлежат уголовной ответственности за убийство (статья 105), умышленное причинение тяжкого вреда здоровью (статья 111), умышленное причинение средней тяжести вреда здоровью (статья 112), похищение человека (статья 126), изнасилование (статья 131), насильственные действия сексуального характера (статья 132), кражу (статья 158), грабеж (статья 161), разбой (статья 162), вымогательство (статья 163), неправомерное завладение автомобилем или иным транспортным средством без цели хищения (статья 166), умышленные уничтожение или повреждение имущества при отягчающих обстоятельствах (часть вторая статьи 167), террористический акт (статья 205), содействие террористической деятельности (статья 205.1), прохождение обучения в целях осуществления террористической деятельности (статья 205.3), организацию террористического сообщества и участие в нем (статья 205.4), организацию деятельности террористической организации и участие в деятельности такой организации (статья 205.5), несообщение о преступлении (статья 205.6), захват заложника (статья 206), заведомо ложное сообщение об акте терроризма (статья 207), участие в незаконном вооруженном формировании (часть вторая статьи 208), угон судна воздушного или водного транспорта либо железнодорожного подвижного состава (статья 211), участие в массовых беспорядках (часть вторая статьи 212), хулиганство при отягчающих обстоятельствах (части вторая и третья статьи 213), вандализм (статья 214), незаконные приобретение, передачу, сбыт, хранение, перевозку или ношение взрывчатых веществ или взрывных устройств (статья 222.1), незаконное изготовление взрывчатых веществ или взрывных устройств (статья 223.1), хищение либо вымогательство оружия, боеприпасов, взрывчатых веществ и взрывных устройств (статья 226), хищение либо вымогательство наркотических средств или психотропных веществ (статья 229), приведение в негодность транспортных средств или путей сообщения (стат 3. Если несовершеннолетний достиг возраста, предусмотренного частями первой или второй настоящей статьи, но вследствие отставания в психическом развитии, не связанном с психическим расстройством, во время совершения общественно опасного деяния не мог в полной мере осознавать фактический характер и общественную опасность своих действий (бездействия) либо руководить ими, он не подлежит уголовной ответственности.`,

A("21",`1. Не подлежит уголовной ответственности лицо, которое во время совершения общественно опасного деяния находилось в состоянии невменяемости, то есть не могло осознавать фактический характер и общественную опасность своих действий (бездействия) либо руководить ими вследствие хронического психического расстройства, временного психического расстройства, слабоумия либо иного болезненного состояния психики.

 ["Важно","Покушение и приготовление возможны только с прямым умыслом."]]);
A("26",`1. Преступлением, совершенным по неосторожности, признается деяние, совершенное по легкомыслию или небрежности.
2. Преступление признается совершенным по легкомыслию, если лицо предвидело возможность наступления общественно опасных последствий своих действий (бездействия), но без достаточных к тому оснований самонадеянно рассчитывало на предотвращение этих последствий.
3. Преступление признается совершенным по небрежности, если лицо не предвидело возможности наступления общественно опасных последствий своих действий (бездействия), хотя при необходимой внимательности и предусмотрительности должно было и могло предвидеть эти последствия.`,
[["Кратко","Легкомыслие: предвидел, но самонадеянно рассчитывал предотвратить. Небрежность: не предвидел, хотя должен был и мог."],
 ["Легкомыслие или косвенный умысел","При легкомыслии лицо рассчитывает на конкретные обстоятельства (свой опыт, исправность машины), при косвенном умысле — ни на что не рассчитывает, а просто допускает последствия."],
 ["Небрежность","Нужны оба критерия: объективный («должно было») и субъективный («могло»). Нет хотя бы одного — это уже невиновное причинение вреда (ст. 28)."]]);
A("27",`Если в результате совершения умышленного преступления причиняются тяжкие последствия, которые по закону влекут более строгое наказание и которые не охватывались умыслом лица, уголовная ответственность за такие последствия наступает только в случае, если лицо предвидело возможность их наступления, но без достаточных к тому оснований самонадеянно рассчитывало на их предотвращение, или в случае, если лицо не предвидело, но должно было и могло предвидеть возможность наступления этих последствий. В целом такое преступление признается совершенным умышленно.`,
[["Кратко","Умысел к основному деянию и неосторожность к более тяжким последствиям. В целом преступление считается умышленным."],
 ["Классика","Ч. 4 ст. 111: умышленно причинён тяжкий вред здоровью, а смерть наступила по неосторожности. Это не убийство, но и не два отдельных преступления."],
 ["Значение","Раз преступление умышленное, возможны соучастие, рецидив и соответствующая категория тяжести."]]);
A("28",`1. Деяние признается совершенным невиновно, если лицо, его совершившее, не осознавало и по обстоятельствам дела не могло осознавать общественной опасности своих действий (бездействия) либо не предвидело возможности наступления общественно опасных последствий и по обстоятельствам дела не должно было или не могло их предвидеть.
2. Деяние признается также совершенным невиновно, если лицо, его совершившее, хотя и предвидело возможность наступления общественно опасных последствий своих действий (бездействия), но не могло предотвратить эти последствия в силу несоответствия своих психофизиологических качеств требованиям экстремальных условий или нервно-психическим перегрузкам.`,
[["Кратко","Случай (казус): вред причинён без умысла и без неосторожности, поэтому ответственности нет."],
 ["Ч. 1","Не должен был или не мог предвидеть последствия. Это граница с небрежностью."],
 ["Ч. 2","Предвидел, но физически и психически не мог предотвратить из-за экстремальных условий или перегрузок. Например, пилот или диспетчер в аварийной ситуации."]]);
A("29",`1. Преступление признается оконченным, если в совершенном лицом деянии содержатся все признаки состава преступления, предусмотренного настоящим Кодексом.
2. Неоконченным преступлением признаются приготовление к преступлению и покушение на преступление.
3. Уголовная ответственность за неоконченное преступление наступает по статье настоящего Кодекса, предусматривающей ответственность за оконченное преступление, со ссылкой на статью 30 настоящего Кодекса.`,
[["Кратко","Стадии: приготовление, покушение, оконченное преступление."],
 ["Квалификация","Неоконченное преступление пишется со ссылкой на ст. 30: приготовление — «ч. 1 ст. 30, ч. 1 ст. 105», покушение — «ч. 3 ст. 30, ч. 1 ст. 105»."],
 ["Момент окончания","Зависит от конструкции состава: материальный — с наступлением последствий, формальный — с совершением действия, усечённый — уже на стадии, которая по общим правилам была бы покушением или приготовлением (например, разбой окончен с момента нападения)."]]);
A("30",`1. Приготовлением к преступлению признаются приискание, изготовление или приспособление лицом средств или орудий совершения преступления, приискание соучастников преступления, сговор на совершение преступления либо иное умышленное создание условий для совершения преступления, если при этом преступление не было доведено до конца по не зависящим от этого лица обстоятельствам.
2. Уголовная ответственность наступает за приготовление только к тяжкому и особо тяжкому преступлениям.
3. Покушением на преступление признаются умышленные действия (бездействие) лица, непосредственно направленные на совершение преступления, если при этом преступление не было доведено до конца по не зависящим от этого лица обстоятельствам.`,
[["Кратко","Приготовление — создание условий. Покушение — начало выполнения объективной стороны. В обоих случаях преступление не доведено до конца по независящим от лица причинам."],
 ["Важно","Приготовление наказуемо только к тяжким и особо тяжким преступлениям. Покушение наказуемо на любое умышленное преступление."],
 ["Отличие","Купил нож, чтобы убить: приготовление. Замахнулся и ударил, но потерпевшего спасли врачи: покушение."]]);
A("31",`1. Добровольным отказом от преступления признается прекращение лицом приготовления к преступлению либо прекращение действий (бездействия), непосредственно направленных на совершение преступления, если лицо осознавало возможность доведения преступления до конца.
2. Лицо не подлежит уголовной ответственности за преступление, если оно добровольно и окончательно отказалось от доведения этого преступления до конца.
3. Лицо, добровольно отказавшееся от доведения преступления до конца, подлежит уголовной ответственности в том случае, если фактически совершенное им деяние содержит иной состав преступления.
4. Организатор преступления и подстрекатель к преступлению не подлежат уголовной ответственности, если эти лица своевременным сообщением органам власти или иными предпринятыми мерами предотвратили доведение преступления исполнителем до конца. Пособник преступления не подлежит уголовной ответственности, если он предпринял все зависящие от него меры, чтобы предотвратить совершение преступления.
5. Если действия организатора или подстрекателя, предусмотренные частью четвертой настоящей статьи, не привели к предотвращению совершения преступления исполнителем, то предпринятые ими меры могут быть признаны судом смягчающими обстоятельствами при назначении наказания.`,
[["Кратко","Отказ должен быть добровольным (лицо понимало, что может довести до конца) и окончательным. Тогда ответственности за задуманное преступление нет."],
 ["Когда возможен","На стадии приготовления и неоконченного покушения. После оконченного преступления это уже деятельное раскаяние (ст. 75)."],
 ["Ч. 3","Если по пути уже совершено другое преступление, за него отвечают. Например, отказался от убийства, но незаконно хранил пистолет: ответственность по ст. 222."]]);
A("32",`Соучастием в преступлении признается умышленное совместное участие двух или более лиц в совершении умышленного преступления.`,
[["Кратко","Признаки соучастия: два или более лица, каждое из которых субъект преступления; совместность действий; умысел; умышленное преступление."],
 ["Важно","Соучастия в неосторожном преступлении не бывает. Если один из участников невменяем или не достиг возраста, соучастия нет, а тот, кто его использовал, — посредственный исполнитель (ч. 2 ст. 33)."]]);
A("33",`1. Соучастниками преступления наряду с исполнителем признаются организатор, подстрекатель и пособник.
2. Исполнителем признается лицо, непосредственно совершившее преступление либо непосредственно участвовавшее в его совершении совместно с другими лицами (соисполнителями), а также лицо, совершившее преступление посредством использования других лиц, не подлежащих уголовной ответственности в силу возраста, невменяемости или других обстоятельств, предусмотренных настоящим Кодексом.
3. Организатором признается лицо, организовавшее совершение преступления или руководившее его исполнением, а равно лицо, создавшее организованную группу или преступное сообщество (преступную организацию) либо руководившее ими.
4. Подстрекателем признается лицо, склонившее другое лицо к совершению преступления путем уговора, подкупа, угрозы или другим способом.
5. Пособником признается лицо, содействовавшее совершению преступления советами, указаниями, предоставлением информации, средств или орудий совершения преступления либо устранением препятствий, а также лицо, заранее обещавшее скрыть преступника, средства или орудия совершения преступления, следы преступления либо предметы, добытые преступным путем, а равно лицо, заранее обещавшее приобрести или сбыть такие предметы.`,
[["Кратко","Четыре вида соучастников: исполнитель, организатор, подстрекатель, пособник."],
 ["Пособничество","Интеллектуальное (советы, указания, информация) и физическое (средства, орудия, устранение препятствий). Отдельно — заранее обещанное укрывательство или сбыт."],
 ["Частая ошибка","Укрывательство, которое заранее не обещали, — не соучастие, а самостоятельное преступление (ст. 316, только для особо тяжких)."]]);
A("34",`1. Ответственность соучастников преступления определяется характером и степенью фактического участия каждого из них в совершении преступления.
2. Соисполнители отвечают по статье Особенной части настоящего Кодекса за преступление, совершенное ими совместно, без ссылки на статью 33 настоящего Кодекса.
3. Уголовная ответственность организатора, подстрекателя и пособника наступает по статье, предусматривающей наказание за совершенное преступление, со ссылкой на статью 33 настоящего Кодекса, за исключением случаев, когда они одновременно являлись соисполнителями преступления.
4. Лицо, не являющееся субъектом преступления, специально указанным в соответствующей статье Особенной части настоящего Кодекса, участвовавшее в совершении преступления, предусмотренного этой статьей, несет уголовную ответственность за данное преступление в качестве его организатора, подстрекателя либо пособника.
5. В случае недоведения исполнителем преступления до конца по не зависящим от него обстоятельствам остальные соучастники несут уголовную ответственность за приготовление к преступлению или покушение на преступление. За приготовление к преступлению несет уголовную ответственность также лицо, которому по не зависящим от него обстоятельствам не удалось склонить других лиц к совершению преступления.`,
[["Квалификация","Соисполнители — просто по статье Особенной части. Организатор — «ч. 3 ст. 33, ...», подстрекатель — «ч. 4 ст. 33, ...», пособник — «ч. 5 ст. 33, ...»."],
 ["Ч. 4","Не будучи специальным субъектом, нельзя быть исполнителем. Например, частное лицо, помогавшее чиновнику получить взятку, отвечает как пособник."],
 ["Ч. 5","Ответственность соучастников «следует» за исполнителем: если он остановился на покушении, все отвечают за покушение. Неудавшееся подстрекательство — приготовление."]]);
A("35",`1. Преступление признается совершенным группой лиц, если в его совершении совместно участвовали два или более исполнителя без предварительного сговора.
2. Преступление признается совершенным группой лиц по предварительному сговору, если в нем участвовали лица, заранее договорившиеся о совместном совершении преступления.
3. Преступление признается совершенным организованной группой, если оно совершено устойчивой группой лиц, заранее объединившихся для совершения одного или нескольких преступлений.
4. Преступление признается совершенным преступным сообществом (преступной организацией), если оно совершено структурированной организованной группой или объединением организованных групп, действующих под единым руководством, члены которых объединены в целях совместного совершения одного или нескольких тяжких либо особо тяжких преступлений для получения прямо или косвенно финансовой или иной материальной выгоды.
5. Лицо, создавшее организованную группу или преступное сообщество (преступную организацию) либо руководившее ими, подлежит уголовной ответственности за их организацию и руководство ими в случаях, предусмотренных статьями 205.4, 205.5, 208, 209, 210, 281.3 и 282.1 настоящего Кодекса, а также за все совершенные организованной группой или преступным сообществом (преступной организацией) преступления, если они охватывались его умыслом. Другие участники организованной группы или преступного сообщества (преступной организации) несут уголовную ответственность за участие в них в случаях, предусмотренных статьями 205.4, 205.5, 208, 209, 210, 281.3 и 282.1 настоящего Кодекса, а также за преступления, в подготовке или совершении которых они участвовали.
6. Создание организованной группы в случаях, не предусмотренных статьями Особенной части настоящего Кодекса, влечет уголовную ответственность за приготовление к тем преступлениям, для совершения которых она создана.
7. Совершение преступления группой лиц, группой лиц по предварительному сговору, организованной группой или преступным сообществом (преступной организацией) влечет более строгое наказание на основании и в пределах, предусмотренных настоящим Кодексом.`,
[["Кратко","Четыре формы: группа лиц (без сговора), группа по предварительному сговору, организованная группа, преступное сообщество."],
 ["Сговор","Должен состояться до начала выполнения объективной стороны. Договорились уже в процессе — это группа лиц без предварительного сговора."],
 ["Организованная группа","Главный признак — устойчивость: стабильный состав, лидер, планирование, распределение ролей, длительность существования."]]);
A("36",`Эксцессом исполнителя признается совершение исполнителем преступления, не охватывающегося умыслом других соучастников. За эксцесс исполнителя другие соучастники преступления уголовной ответственности не подлежат.`,
[["Кратко","Если исполнитель вышел за пределы договорённости, за «лишнее» отвечает только он."],
 ["Пример","Договорились тайно украсть из квартиры, но один, застигнутый хозяином, применил к нему насилие. Он отвечает за разбой или грабёж, остальные — за кражу."]]);
A("37",`1. Не является преступлением причинение вреда посягающему лицу в состоянии необходимой обороны, то есть при защите личности и прав обороняющегося или других лиц, охраняемых законом интересов общества или государства от общественно опасного посягательства, если это посягательство было сопряжено с насилием, опасным для жизни обороняющегося или другого лица, либо с непосредственной угрозой применения такого насилия.
2. Защита от посягательства, не сопряженного с насилием, опасным для жизни обороняющегося или другого лица, либо с непосредственной угрозой применения такого насилия, является правомерной, если при этом не было допущено превышения пределов необходимой обороны, то есть умышленных действий, явно не соответствующих характеру и опасности посягательства.
2.1. Не являются превышением пределов необходимой обороны действия обороняющегося лица, если это лицо вследствие неожиданности посягательства не могло объективно оценить степень и характер опасности нападения.
3. Положения настоящей статьи в равной мере распространяются на всех лиц независимо от их профессиональной или иной специальной подготовки и служебного положения, а также независимо от возможности избежать общественно опасного посягательства или обратиться за помощью к другим лицам или органам власти.`,
[["Условия посягательства","Общественно опасное, наличное (уже началось или непосредственно угрожает и ещё не окончено), действительное (а не мнимое)."],
 ["Условия защиты","Вред причиняется только посягающему. При посягательстве, опасном для жизни (ч. 1), ограничений по пределам нет. При неопасном для жизни (ч. 2) нельзя явно превышать пределы."],
 ["Важно","Обороняться можно, даже если была возможность убежать или позвать на помощь (ч. 3). Неожиданное нападение исключает превышение (ч. 2.1). Превышение наказуемо только при убийстве (ст. 108) и тяжком или средней тяжести вреде (ст. 114)."]]);
A("38",`1. Не является преступлением причинение вреда лицу, совершившему преступление, при его задержании для доставления органам власти и пресечения возможности совершения им новых преступлений, если иными средствами задержать такое лицо не представлялось возможным и при этом не было допущено превышения необходимых для этого мер.
2. Превышением мер, необходимых для задержания лица, совершившего преступление, признается их явное несоответствие характеру и степени общественной опасности совершенного задерживаемым лицом преступления и обстоятельствам задержания, когда лицу без необходимости причиняется явно чрезмерный, не вызываемый обстановкой вред. Такое превышение влечет за собой уголовную ответственность только в случаях умышленного причинения вреда.`,
[["Кратко","Можно причинить вред преступнику при задержании, если цель — доставить его органам власти и иначе задержать нельзя."],
 ["Отличие от обороны","При обороне отражают посягательство, которое продолжается. При задержании преступление уже совершено, и цель другая — задержать."],
 ["Превышение","Наказуемо только умышленное: ст. 108 ч. 2 и ст. 114 ч. 2."]]);
A("39",`1. Не является преступлением причинение вреда охраняемым уголовным законом интересам в состоянии крайней необходимости, то есть для устранения опасности, непосредственно угрожающей личности и правам данного лица или иных лиц, охраняемым законом интересам общества или государства, если эта опасность не могла быть устранена иными средствами и при этом не было допущено превышения пределов крайней необходимости.
2. Превышением пределов крайней необходимости признается причинение вреда, явно не соответствующего характеру и степени угрожавшей опасности и обстоятельствам, при которых опасность устранялась, когда указанным интересам был причинен вред равный или более значительный, чем предотвращенный. Такое превышение влечет за собой уголовную ответственность только в случаях умышленного причинения вреда.`,
[["Кратко","Вред причиняется правоохраняемым интересам (часто третьих лиц), чтобы устранить большую опасность, если иначе её не устранить."],
 ["Главное условие","Причинённый вред должен быть меньше предотвращённого. Равный или больший вред — превышение."],
 ["Пример","Разбить окно чужой машины, чтобы достать задыхающегося ребёнка."]]);
A("40",`1. Не является преступлением причинение вреда охраняемым уголовным законом интересам в результате физического принуждения, если вследствие такого принуждения лицо не могло руководить своими действиями (бездействием).
2. Вопрос об уголовной ответственности за причинение вреда охраняемым уголовным законом интересам в результате психического принуждения, а также в результате физического принуждения, вследствие которого лицо сохранило возможность руководить своими действиями, решается с учетом положений статьи 39 настоящего Кодекса.`,
[["Кратко","Непреодолимое физическое принуждение (человек полностью лишён возможности руководить собой) исключает преступность."],
 ["Ч. 2","Психическое принуждение и преодолимое физическое оцениваются по правилам крайней необходимости: сравнивают причинённый и предотвращённый вред."]]);
A("41",`1. Не является преступлением причинение вреда охраняемым уголовным законом интересам при обоснованном риске для достижения общественно полезной цели.
2. Риск признается обоснованным, если указанная цель не могла быть достигнута не связанными с риском действиями (бездействием) и лицо, допустившее риск, предприняло достаточные меры для предотвращения вреда охраняемым уголовным законом интересам.
3. Риск не признается обоснованным, если он заведомо был сопряжен с угрозой для жизни многих людей, с угрозой экологической катастрофы или общественного бедствия.`,
[["Кратко","Вред при рискованной деятельности ради общественно полезной цели не преступен, если риск обоснован."],
 ["Условия","Цель нельзя достичь без риска; приняты достаточные меры для предотвращения вреда; нет заведомой угрозы жизни многих людей, экологической катастрофы или общественного бедствия."],
 ["Пример","Испытание нового лекарства или техники, экспериментальная операция."]]);
A("42",`1. Не является преступлением причинение вреда охраняемым уголовным законом интересам лицом, действующим во исполнение обязательных для него приказа или распоряжения. Уголовную ответственность за причинение такого вреда несет лицо, отдавшее незаконные приказ или распоряжение.
2. Лицо, совершившее умышленное преступление во исполнение заведомо незаконных приказа или распоряжения, несет уголовную ответственность на общих основаниях. Неисполнение заведомо незаконных приказа или распоряжения исключает уголовную ответственность.`,
[["Кратко","Исполнитель обязательного приказа не отвечает, отвечает тот, кто отдал незаконный приказ."],
 ["Важно","Если исполнитель знал, что приказ незаконный, он отвечает на общих основаниях. Отказ исполнять заведомо незаконный приказ ответственности не влечёт."]]);
A("43",`1. Наказание есть мера государственного принуждения, назначаемая по приговору суда. Наказание применяется к лицу, признанному виновным в совершении преступления, и заключается в предусмотренных настоящим Кодексом лишении или ограничении прав и свобод этого лица.
2. Наказание применяется в целях восстановления социальной справедливости, а также в целях исправления осужденного и предупреждения совершения новых преступлений.`,
[["Признаки наказания","Мера государственного принуждения; назначается только по приговору суда; только лицу, признанному виновным; состоит в лишении или ограничении прав и свобод; влечёт судимость."],
 ["Цели","Три цели: восстановление социальной справедливости, исправление осуждённого, предупреждение новых преступлений (частное и общее). Кара как цель в законе не названа."]]);
A("44",`Видами наказаний являются:
а) штраф;
б) лишение права занимать определенные должности или заниматься определенной деятельностью;
в) лишение специального, воинского или почетного звания, классного чина и государственных наград;
г) обязательные работы;
д) исправительные работы;
е) ограничение по военной службе;
ж) пункт утратил силу.
з) ограничение свободы;
з.1) принудительные работы;
и) арест;
к) содержание в дисциплинарной воинской части;
л) лишение свободы на определенный срок;
м) пожизненное лишение свободы;
н) смертная казнь.`,
[["Кратко","Перечень исчерпывающий и построен от самого мягкого наказания к самому строгому. Суд не может назначить наказание, которого нет в списке."],
 ["Важно","Арест фактически не применяется: он не введён в действие, потому что для него не созданы условия. Смертная казнь не назначается из-за моратория, подтверждённого Конституционным Судом РФ. Пункт «ж» (конфискация) утратил силу, теперь конфискация — иная мера уголовно-правового характера (гл. 15.1)."]]);
A("45",`1. Обязательные работы, исправительные работы, ограничение по военной службе, принудительные работы, арест, содержание в дисциплинарной воинской части, лишение свободы на определенный срок, пожизненное лишение свободы, смертная казнь применяются только в качестве основных видов наказаний.
2. Штраф, лишение права занимать определенные должности или заниматься определенной деятельностью и ограничение свободы применяются в качестве как основных, так и дополнительных видов наказаний.
3. Лишение специального, воинского или почетного звания, классного чина и государственных наград применяется только в качестве дополнительных видов наказаний.`,
[["Шпаргалка","Только основные: все, кроме четырёх. Смешанные (и основные, и дополнительные): штраф, лишение права занимать должности или заниматься деятельностью, ограничение свободы. Только дополнительное: лишение звания, чина и наград."],
 ["Важно","Основное наказание назначается самостоятельно, дополнительное — только вместе с основным."]]);
A("46",`1. Штраф есть денежное взыскание, назначаемое в пределах, предусмотренных настоящим Кодексом.
2. Штраф устанавливается в размере от пяти тысяч до пяти миллионов рублей или в размере заработной платы или иного дохода осужденного за период от двух недель до пяти лет либо исчисляется в величине, кратной стоимости предмета или сумме коммерческого подкупа, подкупа работника контрактной службы, контрактного управляющего, члена комиссии по осуществлению закупок и иных уполномоченных лиц, представляющих интересы заказчика в сфере закупок товаров, работ, услуг для обеспечения государственных или муниципальных нужд, подкупа арбитра (третейского судьи), взятки или сумме незаконно перемещенных денежных средств и (или) стоимости денежных инструментов. Штраф в размере от пятисот тысяч рублей или в размере заработной платы или иного дохода осужденного за период свыше трех лет может назначаться только в случаях, специально предусмотренных соответствующими статьями Особенной части настоящего Кодекса, за исключением случаев исчисления размера штрафа исходя из величины, кратной сумме коммерческого подкупа, подкупа работника контрактной службы, контрактного управляющего, члена комиссии по осуществлению закупок и иных уполномоченных лиц, представляющих интересы заказчика в сфере закупок товаров, работ, услуг для обеспечения государственных или муниципальных нужд, подкупа арбитра (третейского судьи), взятки или сумме незаконно перемещенных денежных средств и (или) стоимости денежных инструментов. Штраф, исчисляемый исходя из величины, кратной сумме коммерческого подкупа, подкупа работника контрактной службы, контрактного управляющего, члена комиссии по осуществлению закупок и иных уполномоченных лиц, представляющих интересы заказчика в сфере закупок товаров, работ, услуг для обеспечения государственных или муниципальных нужд, подкупа арбитра (третейского судьи), взятки или сумме незаконно перемещенных денежных средств и (или) стоимости денежных инструментов, устанавливается в размере до стократной суммы таких подкупа, взятки или суммы незаконно перемещенных денежных средств и (или) стоимости денежных инструментов, но не может быть менее двадцати пяти тысяч рублей и более пятисот миллионов рублей.
3. Размер штрафа определяется судом с учетом тяжести совершенного преступления и имущественного положения осужденного и его семьи, а также с учетом возможности получения осужденным заработной платы или иного дохода. С учетом тех же обстоятельств суд может назначить штраф с рассрочкой выплаты определенными частями на срок до пяти лет.
4. Штраф в качестве дополнительного вида наказания может назначаться только в случаях, предусмотренных соответствующими статьями Особенной части настоящего Кодекса.
5. В случае злостного уклонения от уплаты штрафа, назначенного в качестве основного наказания, за исключением случаев назначения штрафа в размере, исчисляемом исходя из величины, кратной стоимости предмета или сумме коммерческого подкупа или взятки, штраф заменяется иным наказанием, за исключением лишения свободы. В случае злостного уклонения от уплаты штрафа в размере, исчисляемом исходя из величины, кратной стоимости предмета или сумме коммерческого подкупа или взятки, назначенного в качестве основного наказания, штраф заменяется наказанием в пределах санкции, предусмотренной соответствующей статьей Особенной части настоящего Кодекса. При этом назначенное наказание не может быть условным.`,
[["Три способа исчисления","Фиксированная сумма (от 5 тыс. до 5 млн руб.); доход осуждённого за период (от 2 недель до 5 лет); кратный штраф (до стократной суммы взятки, подкупа и т. п., от 25 тыс. до 500 млн руб.)."],
 ["Важно","Штраф свыше 500 тыс. руб. или за период свыше 3 лет — только если это прямо предусмотрено статьёй Особенной части. Рассрочка возможна до 5 лет."],
 ["Злостное уклонение","Обычный штраф заменяется другим наказанием, но не лишением свободы. Кратный штраф заменяется наказанием в пределах санкции статьи, и оно не может быть условным."]]);
A("47",`1. Лишение права занимать определенные должности или заниматься определенной деятельностью состоит в запрещении занимать должности на государственной службе, в органах местного самоуправления либо заниматься определенной профессиональной или иной деятельностью.
2. Лишение права занимать определенные должности или заниматься определенной деятельностью устанавливается на срок от одного года до пяти лет в качестве основного вида наказания и на срок от шести месяцев до трех лет в качестве дополнительного вида наказания. В случаях, специально предусмотренных соответствующими статьями Особенной части настоящего Кодекса, лишение права занимать определенные должности или заниматься определенной деятельностью устанавливается на срок до двадцати лет в качестве дополнительного вида наказания.
3. Лишение права занимать определенные должности или заниматься определенной деятельностью может назначаться в качестве дополнительного вида наказания и в случаях, когда оно не предусмотрено соответствующей статьей Особенной части настоящего Кодекса в качестве наказания за соответствующее преступление, если с учетом характера и степени общественной опасности совершенного преступления и личности виновного суд признает невозможным сохранение за ним права занимать определенные должности или заниматься определенной деятельностью.
4. В случае назначения этого вида наказания в качестве дополнительного к обязательным работам, исправительным работам, ограничению свободы, а также при условном осуждении его срок исчисляется с момента вступления приговора суда в законную силу. В случае назначения лишения права занимать определенные должности или заниматься определенной деятельностью в качестве дополнительного вида наказания к аресту, содержанию в дисциплинарной воинской части, принудительным работам, лишению свободы оно распространяется на все время отбывания указанных основных видов наказаний, но при этом его срок исчисляется с момента их отбытия.`,
[["Сроки","Основное: от 1 года до 5 лет. Дополнительное: от 6 месяцев до 3 лет, а в случаях, указанных в Особенной части, — до 20 лет."],
 ["Ч. 3","Как дополнительное наказание его можно назначить, даже если санкция статьи о нём молчит. Например, лишить права управлять транспортом за преступление, совершённое с использованием машины."],
 ["Важно","В приговоре должен быть указан конкретный круг должностей или вид деятельности. Формулировка «лишить права занимать руководящие должности» без конкретизации недопустима."]]);
A("48",`При осуждении за совершение тяжкого или особо тяжкого преступления, а также за совершение преступлений, предусмотренных частью первой статьи 207.3, статьями 280, 280.1, частью первой статьи 280.3, частью первой статьи 280.4, частью первой статьи 282, статьей 282.4, частями первой и второй статьи 284.1, статьями 284.2, 284.3, 354.1 настоящего Кодекса, с учетом личности виновного суд может лишить его специального, воинского или почетного звания, классного чина и государственных наград.`,
[["Кратко","Только дополнительное наказание. Назначается при осуждении за тяжкое или особо тяжкое преступление, а также за отдельные перечисленные преступления средней и небольшой тяжести."],
 ["Важно","Это право, а не обязанность суда. Лишить можно только званий и наград, полученных от государства; учёные степени и звания сюда не относятся."]]);
A("49",`1. Обязательные работы заключаются в выполнении осужденным в свободное от основной работы или учебы время бесплатных общественно полезных работ. Вид обязательных работ и объекты, на которых они отбываются, определяются органами местного самоуправления по согласованию с уголовно-исполнительными инспекциями.
2. Обязательные работы устанавливаются на срок от шестидесяти до четырехсот восьмидесяти часов и отбываются не свыше четырех часов в день.
3. В случае злостного уклонения осужденного от отбывания обязательных работ они заменяются принудительными работами или лишением свободы. При этом время, в течение которого осужденный отбывал обязательные работы, учитывается при определении срока принудительных работ или лишения свободы из расчета один день принудительных работ или один день лишения свободы за восемь часов обязательных работ.
4. Обязательные работы не назначаются лицам, признанным инвалидами первой группы, беременным женщинам, женщинам, имеющим детей в возрасте до трех лет, военнослужащим, проходящим военную службу по призыву, а также военнослужащим, проходящим военную службу по контракту на воинских должностях рядового и сержантского состава, если они на момент вынесения судом приговора не отслужили установленного законом срока службы по призыву.`,
[["Кратко","Бесплатный общественно полезный труд в свободное время. От 60 до 480 часов, не больше 4 часов в день."],

A("50",`1. Исправительные работы назначаются осужденному, имеющему основное место работы.

3. Из заработной платы осужденного к исправительным работам производятся удержания в доход государства в размере, установленном приговором суда, в пределах от пяти до двадцати процентов.
4. В случае злостного уклонения осужденного от отбывания исправительных работ суд может заменить неотбытое наказание принудительными работами или лишением свободы из расчета один день принудительных работ или один день лишения свободы за три дня исправительных работ.
5. Исправительные работы не назначаются лицам, признанным инвалидами первой группы, беременным женщинам, женщинам, имеющим детей в возрасте до трех лет, военнослужащим, проходящим военную службу по призыву, а также военнослужащим, проходящим военную службу по контракту на воинских должностях рядового и сержантского состава, если они на момент вынесения судом приговора не отслужили установленного законом срока службы по призыву.`,
[["Кратко","Отбываются по основному месту работы, из зарплаты удерживается от 5 до 20% в доход государства. Срок от 2 месяцев до 2 лет."],

A("51",`1. Ограничение по военной службе назначается осужденным военнослужащим, проходящим военную службу по контракту, на срок от трех месяцев до двух лет в случаях, предусмотренных соответствующими статьями Особенной части настоящего Кодекса за совершение преступлений против военной службы, а также осужденным военнослужащим, проходящим военную службу по контракту, вместо исправительных работ, предусмотренных соответствующими статьями Особенной части настоящего Кодекса.
2. Из денежного довольствия осужденного к ограничению по военной службе производятся удержания в доход государства в размере, установленном приговором суда, но не свыше двадцати процентов. Во время отбывания этого наказания осужденный не может быть повышен в должности, воинском звании, а срок наказания не засчитывается в срок выслуги лет для присвоения очередного воинского звания.`,
[["Кратко","Специальное наказание для контрактников: от 3 месяцев до 2 лет, удержания из довольствия до 20%, запрет повышения в должности и звании."],
 ["Когда","За преступления против военной службы, если это указано в санкции, и вместо исправительных работ для военнослужащих-контрактников."]]);
A("53",`1. Ограничение свободы заключается в установлении судом осужденному следующих ограничений: не уходить из места постоянного проживания (пребывания) в определенное время суток, не посещать определенные места, расположенные в пределах территории соответствующего муниципального образования, не выезжать за пределы территории соответствующего муниципального образования, не посещать места проведения массовых и иных мероприятий и не участвовать в указанных мероприятиях, не изменять место жительства или пребывания, место работы и (или) учебы без согласия специализированного государственного органа, осуществляющего надзор за отбыванием осужденными наказания в виде ограничения свободы, в случаях, предусмотренных законодательством Российской Федерации. При этом суд возлагает на осужденного обязанность являться в специализированный государственный орган, осуществляющий надзор за отбыванием осужденными наказания в виде ограничения свободы, от одного до четырех раз в месяц для регистрации. Установление судом осужденному ограничений на изменение места жительства или пребывания без согласия указанного специализированного государственного органа, а также на выезд за пределы территории соответствующего муниципального образования является обязательным.
2. Ограничение свободы назначается на срок от двух месяцев до четырех лет в качестве основного вида наказания за преступления небольшой тяжести и преступления средней тяжести, а также на срок от шести месяцев до двух лет в качестве дополнительного вида наказания к принудительным работам или лишению свободы в случаях, предусмотренных соответствующими статьями Особенной части настоящего Кодекса.
3. В период отбывания ограничения свободы суд по представлению специализированного государственного органа, осуществляющего надзор за отбыванием осужденными наказания в виде ограничения свободы, может отменить частично либо дополнить ранее установленные осужденному ограничения.
4. Надзор за осужденным, отбывающим ограничение свободы, осуществляется в порядке, предусмотренном уголовно-исполнительным законодательством Российской Федерации, а также издаваемыми в соответствии с ним нормативными правовыми актами уполномоченных федеральных органов исполнительной власти.
5. В случае злостного уклонения осужденного от отбывания ограничения свободы, назначенного в качестве основного вида наказания, суд по представлению специализированного государственного органа, осуществляющего надзор за отбыванием осужденными наказания в виде ограничения свободы, может заменить неотбытую часть наказания принудительными работами или лишением свободы из расчета один день принудительных работ за два дня ограничения свободы или один день лишения свободы за два дня ограничения свободы.
6. Ограничение свободы не назначается военнослужащим, иностранным гражданам, лицам без гражданства, а также лицам, не имеющим места постоянного проживания на территории Российской Федерации.`,
[["Кратко","Осуждённый живёт дома, но под надзором инспекции и с ограничениями. Два ограничения обязательны всегда: не менять место жительства без согласия инспекции и не выезжать за пределы муниципального образования."],
 ["Сроки","Основное: от 2 месяцев до 4 лет, только за преступления небольшой и средней тяжести. Дополнительное: от 6 месяцев до 2 лет к принудительным работам или лишению свободы."],
 ["Кому нельзя","Военнослужащим, иностранцам, апатридам, лицам без постоянного места жительства в РФ."]]);
A("53.1",`1. Принудительные работы заключаются в содержании осужденного в учреждении уголовно-исполнительной системы и привлечении его к труду в местах, определяемых учреждением уголовно-исполнительной системы.
2. Принудительные работы назначаются на срок от двух месяцев до пяти лет за совершение преступления небольшой или средней тяжести либо за совершение тяжкого преступления впервые, за исключением случаев замены наказания в виде лишения свободы принудительными работами в соответствии со статьей 80 настоящего Кодекса.
3. Из заработной платы осужденного к принудительным работам производятся удержания в доход государства, перечисляемые на счет соответствующего территориального органа уголовно-исполнительной системы, в размере, установленном приговором суда, и в пределах от пяти до двадцати процентов.
4. В случае уклонения осужденного от отбывания принудительных работ либо признания осужденного к принудительным работам злостным нарушителем порядка и условий отбывания принудительных работ неотбытая часть наказания заменяется лишением свободы из расчета один день лишения свободы за один день принудительных работ.
5. Принудительные работы не назначаются несовершеннолетним, лицам, признанным инвалидами первой или второй группы, беременным женщинам, женщинам, имеющим детей в возрасте до трех лет, мужчинам, имеющим детей в возрасте до трех лет и являющимся единственным родителем, лицам, достигшим возраста, дающего право на назначение страховой пенсии по старости в соответствии с законодательством Российской Федерации, и признанным полностью неспособными к трудовой деятельности в соответствии с медицинским заключением, выданным в порядке, установленном федеральными законами и иными нормативными правовыми актами Российской Федерации, а также военнослужащим.`,
[["Кратко","Осуждённый содержится в учреждении уголовно-исполнительной системы (исправительный центр) и работает там, где определит учреждение. Из зарплаты удерживается от 5 до 20%."],
 ["Изменение 2025 года","Статья изложена в новой редакции законом от 23.07.2025 № 218-ФЗ. Срок от 2 месяцев до 5 лет; назначается за преступления небольшой и средней тяжести или за тяжкое, совершённое впервые."],
 ["Замена","Уклонение или признание злостным нарушителем: 1 день принудительных работ = 1 день лишения свободы."]]);
A("54",`1. Арест заключается в содержании осужденного в условиях строгой изоляции от общества и устанавливается на срок от одного до шести месяцев. В случае замены обязательных работ или исправительных работ арестом он может быть назначен на срок менее одного месяца.
2. Арест не назначается лицам, не достигшим к моменту вынесения судом приговора восемнадцатилетнего возраста, а также беременным женщинам и женщинам, имеющим детей в возрасте до четырнадцати лет.

A("55",`1. Содержание в дисциплинарной воинской части назначается военнослужащим, проходящим военную службу по призыву, а также военнослужащим, проходящим военную службу по контракту на должностях рядового и сержантского состава, если они на момент вынесения судом приговора не отслужили установленного законом срока службы по призыву. Это наказание устанавливается на срок от трех месяцев до двух лет в случаях, предусмотренных соответствующими статьями Особенной части настоящего Кодекса за совершение преступлений против военной службы, а также в случаях, когда характер преступления и личность виновного свидетельствуют о возможности замены лишения свободы на срок не свыше двух лет содержанием осужденного в дисциплинарной воинской части на тот же срок.
2. При содержании в дисциплинарной воинской части вместо лишения свободы срок содержания в дисциплинарной воинской части определяется из расчета один день лишения свободы за один день содержания в дисциплинарной воинской части.`,
[["Кратко","Наказание для солдат и сержантов по призыву (и некоторых контрактников): от 3 месяцев до 2 лет в дисциплинарном батальоне."],
 ["Замена","Лишение свободы до 2 лет может быть заменено дисбатом на тот же срок, день за день."]]);
A("56",`1. Лишение свободы заключается в изоляции осужденного от общества путем направления его в колонию-поселение, помещения в воспитательную колонию, лечебное исправительное учреждение, исправительную колонию общего, строгого или особого режима либо в тюрьму. Наказание в виде лишения свободы может быть назначено осужденному, совершившему впервые преступление небольшой тяжести, только при наличии отягчающих обстоятельств, предусмотренных статьей 63 настоящего Кодекса, за исключением преступлений, предусмотренных частью первой статьи 228, частью первой статьи 231 и статьей 233 настоящего Кодекса, или только если соответствующей статьей Особенной части настоящего Кодекса лишение свободы предусмотрено как единственный вид наказания.
2. Лишение свободы устанавливается на срок от двух месяцев до двадцати лет.
3. Часть утратила силу.

5. В случае совершения хотя бы одного из преступлений, предусмотренных статьями 205, 205.1, 205.2, 205.3, 205.4, 205.5, частями третьей и четвертой статьи 206, частью четвертой статьи 210, статьей 210.1, частью четвертой статьи 211, статьями 277, 278, 279, 353, 356, 357, 358, 360 и 361 настоящего Кодекса, при частичном или полном сложении сроков лишения свободы при назначении наказаний по совокупности преступлений максимальный срок лишения свободы не может быть более тридцати лет, а по совокупности приговоров - более тридцати пяти лет.`,
[["Сроки","Обычно от 2 месяцев до 20 лет. По совокупности преступлений — до 25 лет, по совокупности приговоров — до 30. Для террористических и ряда других преступлений из ч. 5 — до 30 и 35 лет."],
 ["Важно","Впервые совершившему преступление небольшой тяжести лишение свободы можно назначить, только если есть отягчающие обстоятельства или санкция не предусматривает ничего другого (с исключениями по наркотическим статьям)."]]);
A("57",`1. Пожизненное лишение свободы устанавливается за совершение особо тяжких преступлений, посягающих на жизнь, а также за совершение особо тяжких преступлений против здоровья населения и общественной нравственности, общественной безопасности, основ конституционного строя и безопасности государства, половой неприкосновенности несовершеннолетних.
2. Пожизненное лишение свободы не назначается женщинам, а также лицам, совершившим преступления в возрасте до восемнадцати лет, и мужчинам, достигшим к моменту вынесения судом приговора шестидесятипятилетнего возраста.`,
[["Кратко","Назначается только за особо тяжкие преступления перечисленных видов и только если оно есть в санкции статьи."],
 ["Кому нельзя","Женщинам; совершившим преступление до 18 лет; мужчинам, которым на момент приговора исполнилось 65 лет."],
 ["Связь","УДО возможно после фактического отбытия не менее 25 лет (ч. 5 ст. 79). Отбывается в колонии особого режима (п. «г» ч. 1 ст. 58)."]]);
A("58",`1. Отбывание лишения свободы назначается:
а) лицам, осужденным за преступления, совершенные по неосторожности, а также лицам, осужденным к лишению свободы за совершение умышленных преступлений небольшой и средней тяжести, ранее не отбывавшим лишение свободы, - в колониях-поселениях. С учетом обстоятельств совершения преступления и личности виновного суд может назначить указанным лицам отбывание наказания в исправительных колониях общего режима с указанием мотивов принятого решения;
б) мужчинам, осужденным к лишению свободы за совершение тяжких преступлений, ранее не отбывавшим лишение свободы, а также женщинам, осужденным к лишению свободы за совершение тяжких и особо тяжких преступлений, в том числе при любом виде рецидива, - в исправительных колониях общего режима;
в) мужчинам, осужденным к лишению свободы за совершение особо тяжких преступлений, ранее не отбывавшим лишение свободы, а также при рецидиве или опасном рецидиве преступлений, если осужденный ранее отбывал лишение свободы, - в исправительных колониях строгого режима;
г) мужчинам, осужденным к пожизненному лишению свободы, а также при особо опасном рецидиве преступлений - в исправительных колониях особого режима.
2. Мужчинам, осужденным к лишению свободы за совершение особо тяжких преступлений на срок свыше пяти лет, за совершение преступлений, предусмотренных статьей 205.2, частью второй статьи 205.4, частью первой статьи 206, частью первой статьи 211, статьями 220, 221, 360 настоящего Кодекса, а также при особо опасном рецидиве преступлений отбывание части срока наказания может быть назначено в тюрьме, при этом суд засчитывает время содержания осужденного под стражей до вступления в законную силу обвинительного приговора в срок отбывания наказания в тюрьме.
2.1. Мужчинам, осужденным к лишению свободы за совершение преступлений, предусмотренных статьями 205, 205.1, 205.3, 205.4, 205.5, частями второй - четвертой статьи 206, статьей 208, частями второй - четвертой статьи 211, статьями 277 - 279, 281 - 281.2, частью первой статьи 281.3, статьями 317, 361 настоящего Кодекса, отбывание части срока наказания назначается в тюрьме. При этом период отбывания наказания в тюрьме после зачета времени содержания лица под стражей до вступления в законную силу обвинительного приговора суда должен составлять не менее одного года. Определение вида исправительного учреждения для отбывания срока наказания, оставшегося после отбытия части срока наказания в тюрьме, осуществляется по правилам, установленным настоящей статьей.
3. Лицам, осужденным к лишению свободы, не достигшим к моменту вынесения судом приговора восемнадцатилетнего возраста, отбывание наказания назначается в воспитательных колониях.
4. Изменение вида исправительного учреждения осуществляется судом в соответствии с уголовно-исполнительным законодательством Российской Федерации.`,
[["Шпаргалка","Колония-поселение: неосторожные, а также умышленные небольшой и средней тяжести впервые. Общий режим: мужчины за тяжкие впервые; женщины за тяжкие и особо тяжкие при любом рецидиве. Строгий: мужчины за особо тяжкие впервые, при рецидиве и опасном рецидиве, если ранее отбывали. Особый: пожизненное и особо опасный рецидив. Несовершеннолетние: воспитательная колония."],
 ["Важно","Женщинам не назначаются строгий и особый режим, а также тюрьма. «Ранее отбывал лишение свободы» — значит реально находился в исправительном учреждении."]]);
A("59",`1. Смертная казнь как исключительная мера наказания может быть установлена только за особо тяжкие преступления, посягающие на жизнь.
2. Смертная казнь не назначается женщинам, а также лицам, совершившим преступления в возрасте до восемнадцати лет, и мужчинам, достигшим к моменту вынесения судом приговора шестидесятипятилетнего возраста.
2.1. Смертная казнь не назначается лицу, выданному Российской Федерации иностранным государством для уголовного преследования в соответствии с международным договором Российской Федерации или на основе принципа взаимности, если в соответствии с законодательством иностранного государства, выдавшего лицо, смертная казнь за совершенное этим лицом преступление не предусмотрена или неприменение смертной казни является условием выдачи либо смертная казнь не может быть ему назначена по иным основаниям.
3. Смертная казнь в порядке помилования может быть заменена пожизненным лишением свободы или лишением свободы на срок двадцать пять лет.`,
[["Кратко","Исключительная мера, допустима только за особо тяжкие преступления против жизни. Есть в санкциях пяти статей (например, ч. 2 ст. 105)."],
 ["Мораторий","Смертная казнь не назначается и не исполняется. Конституционный Суд РФ в определении от 19.11.2009 № 1344-О-Р указал, что её назначение невозможно."],
 ["Кому нельзя","Женщинам; совершившим преступление до 18 лет; мужчинам 65 лет и старше; выданным России на условии неприменения казни."]]);
A("60",`1. Лицу, признанному виновным в совершении преступления, назначается справедливое наказание в пределах, предусмотренных соответствующей статьей Особенной части настоящего Кодекса, и с учетом положений Общей части настоящего Кодекса. Более строгий вид наказания из числа предусмотренных за совершенное преступление назначается только в случае, если менее строгий вид наказания не сможет обеспечить достижение целей наказания.
2. Более строгое наказание, чем предусмотрено соответствующими статьями Особенной части настоящего Кодекса за совершенное преступление, может быть назначено по совокупности преступлений и по совокупности приговоров в соответствии со статьями 69 и 70 настоящего Кодекса. Основания для назначения менее строгого наказания, чем предусмотрено соответствующей статьей Особенной части настоящего Кодекса за совершенное преступление, определяются статьей 64 настоящего Кодекса.
3. При назначении наказания учитываются характер и степень общественной опасности преступления и личность виновного, в том числе обстоятельства, смягчающие и отягчающие наказание, а также влияние назначенного наказания на исправление осужденного и на условия жизни его семьи.`,
[["Общие начала","Наказание назначается в пределах санкции статьи Особенной части, с учётом Общей части, с учётом тяжести преступления, личности, смягчающих и отягчающих обстоятельств и влияния на семью."],
 ["Важно","Правило «от мягкого к строгому»: более строгий вид из альтернативной санкции выбирается, только если мягкий не обеспечит целей наказания. Суд должен это мотивировать."],
 ["Выход за санкцию","Выше верхнего предела — только по совокупности (ст. 69, 70). Ниже нижнего — только по ст. 64."]]);
A("61",`1. Смягчающими обстоятельствами признаются:
а) совершение впервые преступления небольшой или средней тяжести вследствие случайного стечения обстоятельств;
б) несовершеннолетие виновного;
в) беременность;
г) наличие малолетних детей у виновного;
д) совершение преступления в силу стечения тяжелых жизненных обстоятельств либо по мотиву сострадания;
е) совершение преступления в результате физического или психического принуждения либо в силу материальной, служебной или иной зависимости;
ж) совершение преступления при нарушении условий правомерности необходимой обороны, задержания лица, совершившего преступление, крайней необходимости, обоснованного риска, исполнения приказа или распоряжения;
з) противоправность или аморальность поведения потерпевшего, явившегося поводом для преступления;
и) явка с повинной, активное способствование раскрытию и расследованию преступления, изобличению и уголовному преследованию других соучастников преступления, розыску имущества, добытого в результате преступления;
к) оказание медицинской и иной помощи потерпевшему непосредственно после совершения преступления, добровольное возмещение имущественного ущерба и морального вреда, причиненных в результате преступления, иные действия, направленные на заглаживание вреда, причиненного потерпевшему.
2. При назначении наказания могут учитываться в качестве смягчающих и обстоятельства, не предусмотренные частью первой настоящей статьи.
3. Если смягчающее обстоятельство предусмотрено соответствующей статьей Особенной части настоящего Кодекса в качестве признака преступления, оно само по себе не может повторно учитываться при назначении наказания.`,
[["Главное отличие от ст. 63","Перечень смягчающих открытый (ч. 2): суд может учесть и то, чего нет в списке, например раскаяние, признание вины, состояние здоровья. Перечень отягчающих, наоборот, закрытый."],
 ["Пункты «и» и «к»","Самые важные на практике: они включают льготу ч. 1 ст. 62 (не более 2/3 максимума) при отсутствии отягчающих обстоятельств."],
 ["Ч. 3","Нельзя учитывать дважды. Если смягчающее обстоятельство уже признак состава (например, аффект в ст. 107), повторно при наказании его не учитывают."]]);
A("62",`1. При наличии смягчающих обстоятельств, предусмотренных пунктами "и" и (или) "к" части первой статьи 61 настоящего Кодекса, и отсутствии отягчающих обстоятельств срок или размер наказания не могут превышать двух третей максимального срока или размера наиболее строгого вида наказания, предусмотренного соответствующей статьей Особенной части настоящего Кодекса.
2. В случае заключения досудебного соглашения о сотрудничестве при наличии смягчающих обстоятельств, предусмотренных пунктом "и" части первой статьи 61 настоящего Кодекса, и отсутствии отягчающих обстоятельств срок или размер наказания не могут превышать половины максимального срока или размера наиболее строгого вида наказания, предусмотренного соответствующей статьей Особенной части настоящего Кодекса.
3. Положения части первой настоящей статьи не применяются, если соответствующей статьей Особенной части настоящего Кодекса предусмотрены пожизненное лишение свободы или смертная казнь. В этом случае наказание назначается в пределах санкции соответствующей статьи Особенной части настоящего Кодекса.
4. В случае заключения досудебного соглашения о сотрудничестве, если соответствующей статьей Особенной части настоящего Кодекса предусмотрены пожизненное лишение свободы или смертная казнь, эти виды наказания не применяются. При этом срок или размер наказания не могут превышать двух третей максимального срока или размера наиболее строгого вида наказания в виде лишения свободы, предусмотренного соответствующей статьей Особенной части настоящего Кодекса.
5. Срок или размер наказания, назначаемого лицу, уголовное дело в отношении которого рассмотрено в порядке, предусмотренном главой 40 Уголовно-процессуального кодекса Российской Федерации, не может превышать две трети максимального срока или размера наиболее строгого вида наказания, предусмотренного за совершенное преступление, а в случае, указанном в статье 226.9 Уголовно-процессуального кодекса Российской Федерации, - одну вторую максимального срока или размера наиболее строгого вида наказания, предусмотренного за совершенное преступление.`,
[["Шпаргалка по «потолкам»","П. «и» или «к» ч. 1 ст. 61 без отягчающих — не более 2/3 максимума. Досудебное соглашение — не более 1/2. Особый порядок (гл. 40 УПК) — не более 2/3. Сокращённое дознание (ст. 226.9 УПК) — не более 1/2."],
 ["Как считать","Берут максимум самого строгого вида наказания в санкции. Максимум 6 лет лишения свободы, значит 2/3 — это 4 года."],
 ["Важно","Если «потолки» совпадают (например, ч. 1 и ч. 5), сначала применяют одну долю, а от результата — другую. Так последовательно применяются правила при их совокупности."]]);
A("63",`1. Отягчающими обстоятельствами признаются:
а) рецидив преступлений;
б) наступление тяжких последствий в результате совершения преступления;
в) совершение преступления в составе группы лиц, группы лиц по предварительному сговору, организованной группы или преступного сообщества (преступной организации);
г) особо активная роль в совершении преступления;
д) привлечение к совершению преступления лиц, которые страдают тяжелыми психическими расстройствами либо находятся в состоянии опьянения, а также лиц, не достигших возраста, с которого наступает уголовная ответственность;
е) совершение преступления по мотивам политической, идеологической, расовой, национальной или религиозной ненависти или вражды либо по мотивам ненависти или вражды в отношении какой-либо социальной группы;
е.1) совершение преступления из мести за правомерные действия других лиц, а также с целью скрыть другое преступление или облегчить его совершение;
ж) совершение преступления в отношении лица или его близких в связи с осуществлением данным лицом служебной деятельности или выполнением общественного долга;
з) совершение преступления в отношении женщины, заведомо для виновного находящейся в состоянии беременности, а также в отношении малолетнего, другого беззащитного или беспомощного лица либо лица, находящегося в зависимости от виновного;
и) совершение преступления с особой жестокостью, садизмом, издевательством, а также мучениями для потерпевшего;
к) совершение преступления с использованием оружия, боевых припасов, взрывчатых веществ, взрывных или имитирующих их устройств, специально изготовленных технических средств, наркотических средств, психотропных, сильнодействующих, ядовитых и радиоактивных веществ, лекарственных и иных химико-фармакологических препаратов, а также с применением физического или психического принуждения;
л) совершение преступления в условиях чрезвычайного положения, стихийного или иного общественного бедствия, а также при массовых беспорядках, в период мобилизации или военного положения, в военное время либо в условиях вооруженного конфликта или ведения боевых действий;
м) совершение преступления с использованием доверия, оказанного виновному в силу его служебного положения или договора;
н) совершение преступления с использованием форменной одежды или документов представителя власти;
о) подпункт утратил силу.
п) совершение преступления в отношении несовершеннолетнего (несовершеннолетней) родителем или иным лицом, на которое возложены обязанности по содержанию, воспитанию, обучению и (или) защите прав и законных интересов несовершеннолетнего (несовершеннолетней), либо лицом, проживающим совместно с несовершеннолетним (несовершеннолетней), либо педагогическим работником или другим работником образовательной организации, медицинской организации, организации, оказывающей социальные услуги, либо иной организации, обязанным осуществлять надзор за несовершеннолетним (несовершеннолетней), либо иным лицом, осуществляющим трудовую деятельность в сфере образования, воспитания, развития несовершеннолетних, организации их отдыха и оздоровления, медицинского обеспечения, социальной защиты и социального обслуживания, в сфере детско-юношеского спорта, культуры и искусства с участием несовершеннолетних;
р) совершение преступления в целях пропаганды, оправдания и поддержки терроризма;
с) совершение преступления в целях пропаганды, оправдания и поддержки диверсии;
т) совершение умышленного преступления с публичной демонстрацией, в том числе в средствах массовой информации или информационно-телекоммуникационных сетях (включая сеть "Интернет");
у) совершение преступления лицом, незаконно находящимся на территории Российской Федерации;
ф) совершение преступления с использованием программно-аппаратных средств доступа к информационным ресурсам, информационно-телекоммуникационным сетям, доступ к которым ограничен.
1.1. Судья (суд), назначающий наказание, в зависимости от характера и степени общественной опасности преступления, обстоятельств его совершения и личности виновного может признать отягчающим обстоятельством совершение преступления в состоянии опьянения, вызванном употреблением алкоголя, наркотических средств, психотропных веществ или их аналогов, новых потенциально опасных психоактивных веществ либо других одурманивающих веществ.
2. Если отягчающее обстоятельство предусмотрено соответствующей статьей Особенной части настоящего Кодекса в качестве признака преступления, оно само по себе не может повторно учитываться при назначении наказания.`,
[["Главное","Перечень отягчающих исчерпывающий и расширительно не толкуется. Непризнание вины, отсутствие раскаяния или мнение потерпевшего о строгом наказании отягчающими не являются."],
 ["Новые пункты","П. «т» (публичная демонстрация преступления, 2024), п. «у» (лицо незаконно находится в РФ, 2024), п. «ф» (использование средств обхода блокировок, закон от 31.07.2025 № 282-ФЗ)."],
 ["Опьянение (ч. 1.1)","Не отягчает автоматически: суд вправе признать его отягчающим и должен объяснить, как опьянение повлияло на совершение преступления."]]);
A("63.1",`В случае если установлено, что лицом, заключившим досудебное соглашение о сотрудничестве, были предоставлены ложные сведения или сокрыты от следователя либо прокурора какие-либо иные существенные обстоятельства совершения преступления, суд назначает ему наказание в общем порядке без применения положений частей второй, третьей и четвертой статьи 62 настоящего Кодекса, касающихся срока и размера наказания, и статьи 64 настоящего Кодекса.`,
[["Кратко","Если сотрудничавший со следствием обманул или скрыл существенные обстоятельства, льготы досудебного соглашения теряются, и наказание назначается в общем порядке."],
 ["Что теряется","«Потолок» в 1/2 (ч. 2 ст. 62), льготы ч. 3 и 4 ст. 62, возможность ст. 64."]]);
A("64",`1. При наличии исключительных обстоятельств, связанных с целями и мотивами преступления, ролью виновного, его поведением во время или после совершения преступления, и других обстоятельств, существенно уменьшающих степень общественной опасности преступления, а равно при активном содействии участника группового преступления раскрытию этого преступления наказание может быть назначено ниже низшего предела, предусмотренного соответствующей статьей Особенной части настоящего Кодекса, или суд может назначить более мягкий вид наказания, чем предусмотрен этой статьей, или не применить дополнительный вид наказания, предусмотренный в качестве обязательного.

3. Виновным в совершении преступлений, предусмотренных статьями 205, 205.1, 205.2, 205.3, 205.4, 205.5, частями третьей и четвертой статьи 206, частью четвертой статьи 210, статьей 210.1, частью четвертой статьи 211, статьями 281 - 281.3 и 361 настоящего Кодекса, либо виновным в совершении сопряженных с осуществлением террористической деятельности преступлений, предусмотренных статьями 277, 278, 279 и 360 настоящего Кодекса, не может быть назначено наказание ниже низшего предела, предусмотренного указанными статьями, или назначен более мягкий вид наказания, чем предусмотренный соответствующей статьей, либо не применен дополнительный вид наказания, предусмотренный в качестве обязательного.`,
[["Три варианта","Ниже низшего предела санкции; более мягкий вид наказания, чем в санкции; не назначать обязательное дополнительное наказание."],
